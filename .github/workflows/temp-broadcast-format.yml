name: Temporary broadcast formatter
on:
  push:
    branches:
      - work/audit-broadcast-perception-v2
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes prettier@3.3.3 --write battle/squad-ai.js battle/modules/49-squad-broadcast.js tools/ai-sim-harness/squad-broadcast-check.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "grasstex-format-bot"
          git config user.email "grasstex-format-bot@users.noreply.github.com"
          git add battle/squad-ai.js battle/modules/49-squad-broadcast.js tools/ai-sim-harness/squad-broadcast-check.js
          git commit -m "Format broadcast consistency fix"
          git push
