name: Issue 361 current-main hill lifecycle diagnostic
on:
  push:
    branches:
      - work/issue361-current-main-hill-replay
permissions:
  contents: read
jobs:
  hill-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Current-main hill scenarios with real command and physical movement
        env:
          COMMAND_AUDIT_VARIANTS: scouts-alive,scouts-dead,three-men,prepared-garrison,blocked-recon
          COMMAND_AUDIT_SECONDS: '425'
          COMMAND_AUDIT_OUTPUT: /tmp/issue361-hill-replay.json
        run: |
          set -euo pipefail
          node scripts/run_command_lifecycle_audit.cjs | tee /tmp/issue361-hill-replay.log
      - name: Publish full diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue361-hill-replay
          path: |
            /tmp/issue361-hill-replay.json
            /tmp/issue361-hill-replay.log
          if-no-files-found: warn
