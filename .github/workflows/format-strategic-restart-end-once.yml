name: Format strategic restart and end-battle changes once
on:
  push:
    branches: [work/strategic-truck-restart-endbattle-20261016]
    paths: ['.github/workflows/format-strategic-restart-end-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/strategic-truck-restart-endbattle-20261016
          persist-credentials: true
      - name: Apply repository Prettier to changed runtime/harness files
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write battle/battle-control.js battle/camera-controls.js tools/ai-sim-harness/camera-possession-lease-check.js
          if git diff --quiet -- battle/battle-control.js battle/camera-controls.js tools/ai-sim-harness/camera-possession-lease-check.js; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add battle/battle-control.js battle/camera-controls.js tools/ai-sim-harness/camera-possession-lease-check.js
          git commit -m "Format terminal guard and end-battle UI fixes"
          git push origin HEAD:work/strategic-truck-restart-endbattle-20261016
