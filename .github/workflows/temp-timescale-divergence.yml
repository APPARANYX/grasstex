name: Temporary timescale divergence
on:
  pull_request:
    paths:
      - '.github/workflows/temp-timescale-divergence.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARITY_SCENARIO: meeting
      PARITY_SEED: timescale-parity
      PARITY_SECONDS: '600'
      PARITY_ONLY: '1x @ 20fps'
      PARITY_REPEAT_REFERENCE: '1'
      PARITY_OUT: reports/diag.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local battle server
        run: |
          mkdir -p /tmp/battle-www
          ln -s "$GITHUB_WORKSPACE" /tmp/battle-www/grasstex
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8765 -t /tmp/battle-www >/tmp/battle-php.log 2>&1 &
          sleep 3
      - name: Print divergence fields
        run: node scripts/run_timescale_parity_benchmark.cjs || true
