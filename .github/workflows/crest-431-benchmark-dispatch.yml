name: Temporary #431 standard benchmark dispatch
on:
  push:
    branches:
      - work/benchmark-431-control-dispatch
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact-seed standard control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run battle-benchmark-standard.yml \
            --repo APPARANYX/grasstex \
            --ref main \
            -f seed=live-mv0z6zy9-4lhnw \
            -f seeds=1 \
            -f battle_type=meeting \
            -f query_off= \
            -f query_on= \
            -f windows=contact+60,every60 \
            -f origin_agent=chatgpt \
            -f correlation_id=issue-431 \
            -f purpose='Validate exact-seed control reproducibility before investigating crest firing LOS'
