name: One-shot world placement formatter
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
  pull-requests: read
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/terrain-grounding-cover-clearance-random-load'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Format world generation changes and delete temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write \
            battle/terrain-features.js \
            battle/modules/01-capture-zone.js \
            tools/ai-sim-harness/world-placement-check.js
          rm .github/workflows/one-shot-world-placement-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- battle/terrain-features.js battle/modules/01-capture-zone.js \
            tools/ai-sim-harness/world-placement-check.js \
            .github/workflows/one-shot-world-placement-format.yml
          git commit -m "Format deterministic terrain placement code and tests"
          git push origin HEAD:${{ github.head_ref }}
