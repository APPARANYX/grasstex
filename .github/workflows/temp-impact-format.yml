name: Temporary impact FX formatter
on:
  push:
    branches:
      - work/audit-impact-fx-restart
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes prettier@3.3.3 --write battle/modules/15-bullet-impact-fx.js tools/ai-sim-harness/impact-fx-restart-check.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "grasstex-format-bot"
          git config user.email "grasstex-format-bot@users.noreply.github.com"
          git add battle/modules/15-bullet-impact-fx.js tools/ai-sim-harness/impact-fx-restart-check.js
          git commit -m "Format impact FX restart guard"
          git push
