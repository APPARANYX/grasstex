name: TEMP Camera Test Style (self-removing)
on:
  push:
    branches:
      - work/strategic-interception-macro-20261016
    paths:
      - .github/workflows/temp-camera-test-style.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Prettier format new camera regression test, then self-remove
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write tools/ai-sim-harness/camera-strategic-fast-flight-check.js
          git rm -- .github/workflows/temp-camera-test-style.yml
          git add -- tools/ai-sim-harness/camera-strategic-fast-flight-check.js
          git config user.name "grasstex-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(camera): format fast-fly regression and remove temporary workflow"
          git push origin HEAD:work/strategic-interception-macro-20261016
