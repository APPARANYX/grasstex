name: One-shot player reticle formatter
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
  pull-requests: read
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/player-hit-marker-bore-dot-ads-sensitivity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Format player reticle files and delete temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write \
            battle/camera-controls.js \
            battle/squad-ai.js \
            battle/modules/14-z-ballistic-raycast.js \
            tools/ai-sim-harness/player-control-check.js \
            tools/ai-sim-harness/ballistics-geometry-check.js
          rm .github/workflows/one-shot-player-reticle-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- battle/camera-controls.js battle/squad-ai.js \
            battle/modules/14-z-ballistic-raycast.js \
            tools/ai-sim-harness/player-control-check.js \
            tools/ai-sim-harness/ballistics-geometry-check.js \
            .github/workflows/one-shot-player-reticle-format.yml
          git commit -m "Format player feedback implementation" 
          git push origin HEAD:${{ github.head_ref }}
