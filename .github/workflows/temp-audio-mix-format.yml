name: Temporary audio mix formatter
on:
  push:
    branches:
      - work/player-menu-audio-mix
    paths:
      - .github/workflows/temp-audio-mix-format.yml
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit formatted code
        run: |
          npx --yes prettier@3.3.3 --write battle/camera-controls.js battle/battle-sim.js battle/modules/00a-audio-mix.js battle/modules/09-voice-runtime.js battle/modules/11-voice-variation.js battle/modules/15-weapon-foley-audio.js battle/modules/15-combat-audio.js tools/ai-sim-harness/audio-mix-check.js tools/ai-sim-harness/player-menu-audio-check.js >/dev/null
          for f in battle/camera-controls.js battle/battle-sim.js battle/modules/00a-audio-mix.js battle/modules/09-voice-runtime.js battle/modules/11-voice-variation.js battle/modules/15-weapon-foley-audio.js battle/modules/15-combat-audio.js tools/ai-sim-harness/audio-mix-check.js tools/ai-sim-harness/player-menu-audio-check.js; do
            echo "GT_FORMAT_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "GT_FORMAT_END:$f"
          done
