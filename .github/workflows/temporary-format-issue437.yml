name: Temporary formatter issue 437
on:
  push:
    branches:
      - 'work/fix437-isolated-retreat-fallback'
    paths:
      - '.github/workflows/temporary-format-issue437.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fix437-isolated-retreat-fallback
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply pinned formatting to scoped issue 437 changes
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write battle/modules/15h-squad-leader-fireteams.js battle/modules/16-squad-plan-stability.js tools/ai-sim-harness/retreat-lost-contact-check.js
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add battle/modules/15h-squad-leader-fireteams.js battle/modules/16-squad-plan-stability.js tools/ai-sim-harness/retreat-lost-contact-check.js
          if ! git diff --cached --quiet; then
            git commit -m "Format issue 437 retreat recovery and regression"
            git push origin HEAD:work/fix437-isolated-retreat-fallback
          fi
