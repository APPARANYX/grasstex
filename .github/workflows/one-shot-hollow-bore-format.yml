name: One-shot hollow bore formatter
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
  pull-requests: read
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/player-hollow-muzzle-dot-smooth-ads'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Apply pinned formatting and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write \
            battle/camera-controls.js \
            tools/ai-sim-harness/player-control-check.js
          rm .github/workflows/one-shot-hollow-bore-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- battle/camera-controls.js tools/ai-sim-harness/player-control-check.js \
            .github/workflows/one-shot-hollow-bore-format.yml
          git commit -m "Format hollow bore dot and smoothing regression" 
          git push origin HEAD:${{ github.head_ref }}
