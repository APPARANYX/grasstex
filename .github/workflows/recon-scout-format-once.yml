name: One-Shot Recon Branch Format
on:
  push:
    branches:
      - work/recon-scout-observation-20261015
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format only recon-changed Javascript (temporary isolated PR branch)
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write battle/squad-ai.js battle/engagement.js tools/ai-sim-harness/recon-scout-observation-check.js
          git diff --check
          if git diff --quiet -- battle/squad-ai.js battle/engagement.js tools/ai-sim-harness/recon-scout-observation-check.js; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add battle/squad-ai.js battle/engagement.js tools/ai-sim-harness/recon-scout-observation-check.js
          git commit -m 'style: apply Prettier 3.3.3 to isolated recon scout changes'
          git push origin HEAD:refs/heads/work/recon-scout-observation-20261015
