name: Format isolated truck visual module

on:
  push:
    branches:
      - work/strategic-truck-visual-20261016
    paths:
      - 'battle/modules/59-strategic-truck-visual.js'
      - '.github/workflows/format-strategic-truck-visual.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/strategic-truck-visual-20261016
          persist-credentials: true
      - name: Format and commit only the isolated truck visual module
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write battle/modules/59-strategic-truck-visual.js
          if git diff --quiet -- battle/modules/59-strategic-truck-visual.js; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add battle/modules/59-strategic-truck-visual.js
          git commit -m "Format isolated strategic truck visual module"
          git push origin HEAD:work/strategic-truck-visual-20261016
