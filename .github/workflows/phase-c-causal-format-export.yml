name: PR522 temporary format export
on:
  pull_request:
    paths:
      - .github/workflows/phase-c-causal-format-export.yml
      - tools/ai-sim-harness/covered-fire-maneuver-causal-check.js
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print canonical formatted causal test
        run: |
          npx --yes prettier@3.3.3 --write tools/ai-sim-harness/covered-fire-maneuver-causal-check.js
          echo 'START_FORMATTED_CAUSAL'
          base64 -w0 tools/ai-sim-harness/covered-fire-maneuver-causal-check.js
          echo
          echo 'END_FORMATTED_CAUSAL'
