name: Temporary transport formatter diff
on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Print exact transport formatter patch
        run: |
          npx --yes prettier@3.3.3 --write battle/modules/22a-commander-strategic-recovery.js tools/ai-sim-harness/strategic-recovery-review-check.js
          echo TRANSPORT_FORMAT_DIFF_BEGIN
          git diff -- battle/modules/22a-commander-strategic-recovery.js tools/ai-sim-harness/strategic-recovery-review-check.js
          echo TRANSPORT_FORMAT_DIFF_END
