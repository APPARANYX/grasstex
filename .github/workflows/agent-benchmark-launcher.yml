name: ⭐ Agent Benchmark Launcher

# Permanent launcher: an agent pushes .github/benchmark-request.json on a
# work/benchmark-launch/** branch; this job dispatches EXISTING benchmark workflows.
# Never edit benchmark implementations or create per-run workflow files.
on:
  push:
    branches:
      - 'work/benchmark-launch/**'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate request and dispatch selected existing benchmark
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          request_path = Path('.github/benchmark-request.json')
          if not request_path.is_file():
              raise SystemExit('Missing .github/benchmark-request.json on launch branch')
          req = json.loads(request_path.read_text())
          if not isinstance(req, dict):
              raise SystemExit('Benchmark request must be a JSON object')
          names = {
              'standard': 'battle-benchmark-standard.yml',
              'causal': 'causal-inaction-benchmark.yml',
              'targeted-fire': 'targeted-fire-control.yml',
              'timescale': 'timescale-parity-benchmark.yml',
              'matrix-smoke': 'matrix-diagnostics-smoke.yml',
              'matrix-full': 'battle-benchmark.yml',
          }
          kind = req.get('benchmark')
          if kind not in names:
              raise SystemExit('Unknown benchmark; choose ' + ', '.join(names))
          ref = req.get('ref', 'main')
          if not isinstance(ref, str) or not re.fullmatch(r'[A-Za-z0-9._/-]{1,120}', ref) or '..' in ref:
              raise SystemExit('Invalid source ref')
          if kind == 'matrix-full' and ref != 'main':
              raise SystemExit('Full matrix runs only from main')
          if kind == 'matrix-full' and req.get('confirm_full_matrix') is not True:
              raise SystemExit('Full 300-battle matrix needs confirm_full_matrix: true')
          allowed = {
              'standard': ('seed', 'seeds', 'query_off', 'query_on', 'battle_type', 'windows', 'origin_agent', 'correlation_id', 'purpose'),
              'causal': ('exact_seed', 'seeds', 'seconds', 'side', 'role', 'ids', 'squads', 'query', 'geometry'),
              'targeted-fire': ('seeds', 'seconds', 'side', 'role', 'ids', 'squads'),
              'timescale': ('seed', 'seconds'),
              'matrix-smoke': (),
              'matrix-full': ('seed', 'battles_per_worker', 'worker_minutes_cutoff'),
          }[kind]
          extras = set(req) - set(allowed) - {'benchmark', 'ref', 'confirm_full_matrix'}
          if extras:
              raise SystemExit('Unsupported parameters for ' + kind + ': ' + ', '.join(sorted(extras)))
          if 'battle_type' in req and req['battle_type'] not in ('meeting', 'us-defend', 'ge-defend'):
              raise SystemExit('Invalid battle_type')
          fields = []
          for key in allowed:
              if key not in req:
                  continue
              val = req[key]
              if not isinstance(val, (str, int)) or isinstance(val, bool) or len(str(val)) > 500:
                  raise SystemExit('Invalid value for ' + key)
              fields.extend(['-f', key + '=' + str(val)])
          cmd = ['gh', 'workflow', 'run', names[kind], '--repo', os.environ['REPO'], '--ref', ref, *fields]
          print('Dispatching', kind, 'via', names[kind], 'at', ref, 'with keys', sorted(set(req) & set(allowed)), flush=True)
          subprocess.run(cmd, check=True)
          print('Dispatch accepted; confirm the child run separately in Actions.', flush=True)
          PY
