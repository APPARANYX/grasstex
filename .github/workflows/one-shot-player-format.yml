name: One-shot player feedback formatting
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
  pull-requests: read
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/player-hud-haptics-damage-offscreen-squads'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Format touched files and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write \
            battle/camera-controls.js \
            battle/modules/41-squad-status-overlay.js \
            tools/ai-sim-harness/player-control-check.js \
            tools/ai-sim-harness/squad-status-overlay-check.js
          rm .github/workflows/one-shot-player-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- battle/camera-controls.js battle/modules/41-squad-status-overlay.js \
            tools/ai-sim-harness/player-control-check.js \
            tools/ai-sim-harness/squad-status-overlay-check.js \
            .github/workflows/one-shot-player-format.yml
          git commit -m "Format player feedback and overlay files with Prettier 3.3.3"
          git push origin HEAD:${{ github.head_ref }}
