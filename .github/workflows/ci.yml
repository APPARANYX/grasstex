name: CI

# The single gate for pull requests; production deployment validates merged main separately. Before this nothing ran on a PR at all: syntax errors,
# a manifest naming a clip that does not exist, and audio committed off the mastering
# standard all reached main unchallenged.
#
# This also absorbs two workflows that were not doing their jobs. validate-simplify.yml ran
# the AI sim regression suite only on a branch named simplify-v134, which does not exist, so
# that suite had been running nowhere. normalize-audio.yml re-mastered and committed to main,
# which is how 284 pointlessly re-encoded mp3s landed there, and its unfiltered push trigger
# let any branch publish itself to main. The mastering standard is asserted here instead, so
# a pull request has to arrive already correct rather than be silently rewritten afterwards.
#
# Deliberately not absorbed: the deploy workflows, which publish rather than check, and the
# tag-triggered battle benchmarks, which run hundreds of battles across parallel workers and
# have no business on a pull request.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A force-push or a quick second push should not leave two runs racing on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect audio and deploy-plan changes
    runs-on: ubuntu-latest
    outputs:
      audio: ${{ steps.diff.outputs.changed }}
      plan: ${{ steps.diff.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff against PR base
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" || -z "$BASE_SHA" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "plan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/audio_tracker.py diff "$BASE_SHA" --github-output "$GITHUB_OUTPUT"
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(Assets/audio/|scripts/(recipes/|audio_tracker\\.py|normalize_audio\\.sh|build_voice_pitch_variants\\.sh|validate_voice_manifest\\.py|check_audio_manifest\\.py|check_weapon_clips\\.py|fetch_private_audio\\.sh|slice_weapon_shots\\.py|prepare_incremental_deploy\\.py|check_deploy_coverage\\.py|check_deploy_safety\\.py|build_version\\.py)|\\.github/workflows/(ci|deploy-50webs-php)\\.yml|battle/(battle_sim\\.html|module-registry\\.js))'; then
            echo "plan=true" >> "$GITHUB_OUTPUT"
          else
            echo "plan=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JavaScript
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            node --check "$file"
            count=$((count+1))
          done < <(git ls-files '*.js' '*.cjs' '*.mjs')
          echo "Parsed $count JavaScript files."

      - name: PHP
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null
            count=$((count+1))
          done < <(git ls-files '*.php')
          echo "Linted $count PHP files."

      - name: Preview launcher
        run: python3 scripts/check-preview-launcher.py

      - name: Python
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.py')
          python3 -m py_compile "${files[@]}"
          echo "Compiled ${#files[@]} Python files."

      - name: Shell
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            bash -n "$file"
            count=$((count+1))
          done < <(git ls-files '*.sh')
          echo "Parsed $count shell scripts."

      - name: JSON
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            python3 -m json.tool "$file" > /dev/null
            count=$((count+1))
          done < <(git ls-files '*.json')
          echo "Parsed $count JSON files."

      # Prettier ratchet: the repo's .prettierrc.json was dead config - most tracked JS never
      # complied. A full one-shot reformat would break every in-flight branch, so instead every
      # JS file a pull request touches must be on-standard. Legacy files stay as they are and
      # converge as they get edited; nothing that was ever cleaned may regress.
      - name: Prettier ratchet
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" ]]; then
            echo "No pull-request base: the ratchet runs on pull requests only."
            exit 0
          fi
          mapfile -t files < <(git diff --name-only "$BASE_SHA" HEAD -- '*.js' | while IFS= read -r f; do [[ -f "$f" ]] && printf '%s\n' "$f"; done)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No JavaScript files changed."
            exit 0
          fi
          echo "Checking ${#files[@]} changed JavaScript file(s) against .prettierrc.json."
          npx --yes prettier@3.3.3 --check "${files[@]}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  audio:
    name: Audio library
    needs: changes
    if: needs.changes.outputs.audio == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # No audio clip is in this public repo: check out the private APPARANYX/grasstex-audio at the
      # commit Assets/audio/private-audio.lock.json pins, with a private-audio deploy key, and overlay it
      # onto Assets/audio/ (scripts/fetch_private_audio.sh).
      - name: Pinned private audio commit
        id: private-audio
        run: echo "commit=$(python3 -c 'import json;print(json.load(open("Assets/audio/private-audio.lock.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the private audio
        uses: actions/checkout@v4
        with:
          repository: APPARANYX/grasstex-audio
          ref: ${{ steps.private-audio.outputs.commit }}
          ssh-key: ${{ secrets.PRIVATE_AUDIO_READ_KEY || secrets.AUDIO_PRIVATE_WRITE_KEY }}
          path: .runtime/private-audio
          persist-credentials: false

      - name: Overlay the private audio
        run: bash scripts/fetch_private_audio.sh .runtime/private-audio

      - name: Voice manifest
        run: python3 scripts/validate_voice_manifest.py

      - name: Clip references
        run: python3 scripts/check_audio_manifest.py

      - name: Slice recipes
        run: |
          set -euo pipefail
          for recipe in scripts/recipes/*.json; do
            python3 scripts/slice_weapon_shots.py "$recipe" --check-only
          done

      # A category with no mastering target is not an error anyone sees: the pass skips the
      # file and moves on, so it ships unmastered. grenades/pin, throw and bounce sat in the
      # manifest in exactly that state. Ask the script itself what each declared path would
      # be mastered as, so its tables stay the single source of truth.
      - name: Every declared category has a mastering target
        run: |
          set -euo pipefail
          python3 -c "
          import json
          m = json.load(open('Assets/audio/manifest.json'))
          paths = {p for g in m['categories'].values() for v in g.values() for p in v}
          print('\n'.join('Assets/audio/' + p for p in sorted(paths)))
          " > "$RUNNER_TEMP/paths.txt"
          xargs -a "$RUNNER_TEMP/paths.txt" bash scripts/normalize_audio.sh --explain \
            | awk '{print $1}' | sort | uniq -c
          echo "A run with no UNCOVERED rows means every declared category is mastered."

      # The check that matters most. Mastering is hash-skipped, so on a tree whose audio is
      # already on standard this re-encodes nothing and cannot produce a diff - which makes
      # it independent of the runner's FFmpeg build. A diff here means either audio was
      # committed without running the mastering pass, or .mastering-state.tsv no longer
      # describes the files beside it. Both are how the library silently drifts off spec.
      - name: Mastering is current
        run: |
          set -euo pipefail
          bash scripts/normalize_audio.sh Assets/audio
          if ! git diff --quiet -- Assets/audio; then
            echo "::error::Committed audio is not on the mastering standard."
            echo "Run 'bash scripts/normalize_audio.sh Assets/audio' and commit the result."
            echo "Files the mastering pass changed:"
            git diff --name-only -- Assets/audio
            exit 1
          fi
          echo "Audio is on standard; the mastering pass changed nothing."

  harness:
    name: Sim regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Lifted from .github/workflows/validate-simplify.yml, which triggered only on a branch
      # named simplify-v134. No such branch exists, so this suite ran nowhere at all. It
      # passes on main and the whole thing takes seconds, so it belongs on every PR.
      - name: Harness syntax
        run: |
          set -euo pipefail
          for file in tools/ai-sim-harness/*.js; do node --check "$file"; done
          echo "Parsed $(ls tools/ai-sim-harness/*.js | wc -l) harness files."

      - name: Regression checks
        run: |
          set -euo pipefail
          # Every check in tools/ai-sim-harness, not just the seven the old workflow named:
          # macro-command-toggle, map-pipeline, movement-recovery and movement-state were
          # never wired to anything.
          for check in tools/ai-sim-harness/*-check.js; do
            echo "--- $(basename "$check")"
            node "$check"
          done

      - name: Engagement harness seeds
        run: |
          set -euo pipefail
          for seed in 12345 1 2 3 5 8 13 21; do
            HARNESS_SEED="$seed" node tools/ai-sim-harness/run.js > /dev/null
          done
          echo "Engagement harness clean across 8 seeds."

  deploy-plan:
    name: Deploy plan
    needs: changes
    if: needs.changes.outputs.plan == 'true'
    runs-on: ubuntu-latest
    steps:
      # build_version.py reads build-v<N> tags to work out the next version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No audio clip is in this public repo: check out the private APPARANYX/grasstex-audio at the
      # commit Assets/audio/private-audio.lock.json pins, with a private-audio deploy key, and overlay it
      # onto Assets/audio/ (scripts/fetch_private_audio.sh).
      - name: Pinned private audio commit
        id: private-audio
        run: echo "commit=$(python3 -c 'import json;print(json.load(open("Assets/audio/private-audio.lock.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the private audio
        uses: actions/checkout@v4
        with:
          repository: APPARANYX/grasstex-audio
          ref: ${{ steps.private-audio.outputs.commit }}
          ssh-key: ${{ secrets.PRIVATE_AUDIO_READ_KEY || secrets.AUDIO_PRIVATE_WRITE_KEY }}
          path: .runtime/private-audio
          persist-credentials: false

      - name: Overlay the private audio
        run: bash scripts/fetch_private_audio.sh .runtime/private-audio

      - name: Every runtime the page loads is covered
        run: python3 scripts/check_deploy_coverage.py

      # The runtime loads clips from this pack; it must match the clip FBX, CLIPS and the converter.
      - name: Prepared clips match their sources
        run: node scripts/check_clip_pack.cjs

      # prepare_incremental_deploy.py fails on any managed file that is missing or empty,
      # so building the plan is itself the check: it proves a real deploy would find
      # everything it intends to upload, including the audio the manifest points at.
      - name: Plan builds against a bare remote
        run: |
          set -euo pipefail
          python3 scripts/build_version.py stamp
          python3 scripts/prepare_incremental_deploy.py \
            --remote-manifest /dev/null \
            --audio-manifest Assets/audio/manifest.json \
            --output "$RUNNER_TEMP/deploy-plan"
          cat "$RUNNER_TEMP/deploy-plan/summary.json"

      # Sidecar JSON, the FBX soldier-animation lab and anything else the repo does not manage live
      # only on the server; a deploy must never delete or overwrite them. Needs the stamp above.
      - name: Deploy never touches unmanaged server files
        run: python3 scripts/check_deploy_safety.py

  pr317-live-8x:
    name: PR317 live 8x remnant extraction
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/remnant-extraction-home'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local battle server
        run: |
          set -euo pipefail
          rm -rf /tmp/battle-www
          mkdir -p /tmp/battle-www
          ln -s "$GITHUB_WORKSPACE" /tmp/battle-www/grasstex
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8765 -t /tmp/battle-www >/tmp/battle-php.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=pr317-health" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/battle-php.log
          exit 1

      - name: Run live 8x extraction invariant
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            try {
              const page = await browser.newPage({ignoreHTTPSErrors:true,viewport:{width:900,height:650}});
              await page.route('**/*', route => {
                const req = route.request();
                if (req.method() === 'POST' || /battle_(policy|learning|log|metrics)[^/]*\.php/.test(req.url()))
                  return route.fulfill({status:200,contentType:'application/json',body:'{}'});
                return route.continue();
              });
              await page.goto('http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=pr317-live-8x',{waitUntil:'load',timeout:180000});
              await page.waitForFunction(() => window.__battle__ && window.SquadAI && window.BattleSquadStability,null,{timeout:180000});
              const setup = await page.evaluate(() => {
                const b=window.__battle__, q=b.factions.ge.squads[0], home={x:q.home.x,z:q.home.z};
                const men=q.members.filter(s=>!s.dead);
                men.slice(4).forEach(s=>b.killSoldier(s,null));
                const live=q.members.filter(s=>!s.dead);
                const depths=[80,190,300,410];
                live.forEach((s,i)=>{
                  s.root.position.x=home.x;
                  s.root.position.z=home.z-depths[i];
                  s.destination={x:s.root.position.x,z:s.root.position.z};
                  s.orderDestination={x:s.root.position.x,z:s.root.position.z};
                  s._fireteamDestination={x:s.root.position.x,z:s.root.position.z};
                });
                q.state='retreat';
                q._assembly={phase:'to-base',since:b.time,missionVersion:null};
                q._moraleRallyPoint=null;
                q._regroupRecovery={serial:77,startedAt:b.time,anchor:{x:home.x,z:home.z-250}};
                q.orderAnchor={x:home.x,z:home.z-260};
                q.rally={x:home.x,z:home.z-260};
                q._orderGoal={x:home.x,z:home.z-260};
                b.timeScale=8;
                b.paused=false;
                if (b.resume) b.resume();
                return {home, ids:live.map(s=>s.id), start:live.map(s=>({id:s.id,z:s.root.position.z}))};
              });
              await page.waitForTimeout(3000);
              const samples=[];
              for(let i=0;i<32;i++){
                samples.push(await page.evaluate(ids=>{
                  const b=window.__battle__,q=b.factions.ge.squads[0],home=q.home,L=window.BattleLeases;
                  return {
                    t:+b.time.toFixed(3),
                    state:q.state,
                    anchor:{x:q.orderAnchor.x,z:q.orderAnchor.z},
                    rally:{x:q.rally.x,z:q.rally.z},
                    retreatLease:!!(L&&L.get(q,'retreat-anchor')),
                    regroupRecovery:!!q._regroupRecovery,
                    men:q.members.filter(s=>ids.includes(s.id)&&!s.dead).map(s=>({
                      id:s.id,
                      x:+s.root.position.x,
                      z:+s.root.position.z,
                      order:s.orderDestination&&{x:+s.orderDestination.x,z:+s.orderDestination.z},
                      fireteam:s._fireteamDestination&&{x:+s._fireteamDestination.x,z:+s._fireteamDestination.z}
                    }))
                  };
                },setup.ids));
                await page.waitForTimeout(80);
              }
              const eps=.05, home=setup.home;
              for(const row of samples){
                assert.equal(row.state,'retreat','remnant left retreat at t='+row.t);
                assert.ok(Math.hypot(row.anchor.x-home.x,row.anchor.z-home.z)<=eps,'anchor left home at t='+row.t);
                assert.ok(Math.hypot(row.rally.x-home.x,row.rally.z-home.z)<=eps,'rally left home at t='+row.t);
                assert.equal(row.retreatLease,false,'sliding retreat-anchor lease reappeared at t='+row.t);
                assert.equal(row.regroupRecovery,false,'regroup recovery survived extraction at t='+row.t);
                for(const man of row.men){
                  /* orderDestination may be a Navigation-legalized waypoint around terrain. The Meso
                     command invariant is _fireteamDestination: that is the Squad Leader's destination
                     before Navigation/Movement Resolver choose a physical route. */
                  assert.ok(man.fireteam && Math.hypot(man.fireteam.x-home.x,man.fireteam.z-home.z)<=eps,'soldier '+man.id+' squad-command intent not home at t='+row.t);
                }
              }
              const end=samples[samples.length-1];
              console.log(JSON.stringify({timeScale:8,home,start:setup.start,end:end.men.map(m=>({id:m.id,z:+m.z.toFixed(1),order:m.order,fireteam:m.fireteam})),samples:samples.length,simStart:samples[0].t,simEnd:end.t},null,2));
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

