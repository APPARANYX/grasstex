# follow-up floating-point regression fixture format
name: Audit 456 range geometry formatter
on:
  push:
    branches:
      - 'work/format-audit456/range'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/audit456-range-geometry-extraction
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format range-geometry and exact-contract test only
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write battle/modules/98-damage-range.js tools/ai-sim-harness/damage-range-geometry-check.js
          git add battle/modules/98-damage-range.js tools/ai-sim-harness/damage-range-geometry-check.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format #456 damage-range pure geometry extraction'
          git push origin HEAD:work/audit456-range-geometry-extraction
