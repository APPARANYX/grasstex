name: Temporary issue 437 probe formatter
on:
  push:
    branches:
      - 'work/fix437-isolated-retreat-fallback'
    paths:
      - '.github/workflows/temporary-format-issue437-probe.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fix437-isolated-retreat-fallback
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply pinned formatter to probe and red-green fixture
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write scripts/probes/route-437.js tools/ai-sim-harness/retreat-lost-contact-check.js
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add scripts/probes/route-437.js tools/ai-sim-harness/retreat-lost-contact-check.js
          if ! git diff --cached --quiet; then
            git commit -m "Format focused issue 437 probe and validation fixture"
            git push origin HEAD:work/fix437-isolated-retreat-fallback
          fi
