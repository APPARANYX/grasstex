name: One-shot truck wheel formatting
on:
  push:
    branches: [work/strategic-truck-wheel-integration-20261016]
    paths: ['.github/workflows/format-truck-wheels-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/strategic-truck-wheel-integration-20261016
          persist-credentials: true
      - name: Format battle truck wheel module and remove this temporary workflow
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write battle/modules/59-strategic-truck-visual.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-truck-wheels-once.yml
          git add battle/modules/59-strategic-truck-visual.js
          git commit -m "Format truck wheel animation and remove one-shot formatter"
          git push origin HEAD:work/strategic-truck-wheel-integration-20261016
