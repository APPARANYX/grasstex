name: Temporary assault approach formatting
on:
  pull_request:
    paths:
      - .github/workflows/tmp-assault-approach-format.yml
permissions:
  contents: read
jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: |
          npx --yes prettier@3.3.3 --write battle/modules/13e-tactical-covered-maneuver.js battle/modules/16-squad-plan-stability.js
          node - <<'NODE'
          const fs=require('fs');
          for(const path of ['battle/modules/13e-tactical-covered-maneuver.js','battle/modules/16-squad-plan-stability.js'])
            console.log('FORMAT_HANDOFF '+JSON.stringify({path,content:fs.readFileSync(path,'utf8')}));
          NODE
