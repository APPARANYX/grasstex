name: Phase C Natural Full-Battle Acceptance
on:
  push:
    branches:
      - work/phase-c-operation-continuity-20261014
    paths:
      - .github/workflows/phase-c-natural-field-qa.yml
  pull_request:
    paths:
      - scripts/probes/probe_phase_c_natural.cjs
      - .github/workflows/phase-c-natural-field-qa.yml
      - battle/modules/15a-squad-leader-fire-control.js
      - battle/modules/15o-squad-leader-tactical-postures.js
      - battle/modules/15j-squad-leader-fire-and-movement.js
      - battle/modules/19-engagement-cover-positions.js
      - battle/modules/19b-engagement-fire-stance.js
      - battle/engagement.js
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase-c-operation-natural-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paired-natural:
    name: Natural ${{ matrix.battle_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        battle_type: [meeting, us-defend, ge-defend]
    steps:
      - uses: actions/checkout@v4
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local full-battle server
        run: |
          set -euo pipefail
          mkdir -p /tmp/battle-www
          ln -s "$GITHUB_WORKSPACE" /tmp/battle-www/grasstex
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8765 -t /tmp/battle-www > /tmp/phase-c-field-php.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=phase-c-health" > /dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/phase-c-field-php.log
          exit 1
      - name: Unmodified same-seed OFF/ON natural field replay
        env:
          C_FIELD_TYPE: ${{ matrix.battle_type }}
          C_FIELD_COUNT: '18'
          C_FIELD_SECONDS: '600'
          C_FIELD_PREFIX: phase-c-natural-20261012
          C_FIELD_AUTONOMOUS_MOVEMENT: '1'
          C_FIELD_SMART_INGRESS: '0'
          C_FIELD_OPERATION: '1'
          # Run 54 ON natural battles against the same previously pinned OFF baseline.
          # This changes runtime cost only; it never changes acceptance criteria.
          C_FIELD_ARMS: 'on'
          C_FIELD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/probes/probe_phase_c_natural.cjs
      - name: Upload paired causal observation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-c-natural-${{ matrix.battle_type }}
          path: reports/phase-c-field/*.json
          retention-days: 30
      - name: Server diagnostics
        if: failure()
        run: tail -100 /tmp/phase-c-field-php.log || true

  natural-chain-acceptance:
    name: Complete natural fire-and-maneuver chain
    needs: paired-natural
    runs-on: ubuntu-latest
    steps:
      - name: Download natural field observations
        uses: actions/download-artifact@v4
        with:
          pattern: phase-c-natural-*
          path: natural-field
          merge-multiple: true
      - name: Require same-squad preparation, support fire, movement and arrival
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const files=fs.readdirSync('natural-field').filter(f=>f.endsWith('.json'));
          if(!files.length) throw new Error('no Phase C natural field observations downloaded');
          let complete=0,attempts=0,prepared=0,maneuvers=0;
          const rows=[];
          for(const file of files){
            const d=JSON.parse(fs.readFileSync(path.join('natural-field',file),'utf8'));
            const on=d.arms&&d.arms.on||{};
            complete+=+on.completedNaturalChains||0;
            attempts+=+on.ambush||0;
            prepared+=+on.prepared||0;
            maneuvers+=+on.maneuvers||0;
            rows.push({file,ambush:+on.ambush||0,prepared:+on.prepared||0,maneuvers:+on.maneuvers||0,completedNaturalChains:+on.completedNaturalChains||0});
          }
          console.log('PHASE_C_NATURAL_ACCEPTANCE',JSON.stringify({complete,attempts,prepared,maneuvers,rows}));
          if(complete<1) throw new Error('Phase C requires at least one complete natural same-squad fire-and-maneuver chain');
          NODE
