name: Temporary fire-control formatter
on:
  push:
    branches:
      - work/audit-fire-control-liveness-v2
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes prettier@3.3.3 --write battle/modules/15a-squad-leader-fire-control.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "grasstex-format-bot"
          git config user.email "grasstex-format-bot@users.noreply.github.com"
          git add battle/modules/15a-squad-leader-fire-control.js
          git commit -m "Format fire-control liveness fix"
          git push
