name: Issue 361 named hill seed baseline dispatch
on:
  push:
    branches:
      - work/issue361-hill-seed-replay-dispatch
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Current main deterministic hillside incident replays
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run battle-benchmark-standard.yml \
            --repo APPARANYX/grasstex --ref work/issue361-pinned-main-hill \
            -f seed=hill-0002 -f seeds=1 -f battle_type=ge-defend \
            -f query_off='' -f query_on='' \
            -f windows=contact+60,every60 \
            -f origin_agent=chatgpt -f correlation_id=issue361-hill0002-main \
            -f purpose="Current-main ge-defend hill0002 recon-timeout and us3 anchor follow-through"
          gh workflow run battle-benchmark-standard.yml \
            --repo APPARANYX/grasstex --ref work/issue361-pinned-main-hill \
            -f seed=hill-0008 -f seeds=1 -f battle_type=us-defend \
            -f query_off='' -f query_on='' \
            -f windows=contact+60,every60 \
            -f origin_agent=chatgpt -f correlation_id=issue361-hill0008-main \
            -f purpose="Current-main us-defend hill0008 assault path-blocked and ge4 formation"
