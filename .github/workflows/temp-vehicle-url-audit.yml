name: TEMP Vehicle FBX Preview URL Audit (self-removing)
on:
  push:
    branches:
      - work/strategic-interception-macro-20261016
    paths:
      - .github/workflows/temp-vehicle-url-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Probe exact served FBX and self-remove diagnostic
        shell: bash
        run: |
          set -euo pipefail
          for origin in \
            'https://test.ivandpopov.com/grasstex/Assets/vehicles/german_transport.fbx' \
            'https://test.ivandpopov.com/grasstex/preview/ref-f19040a85945/Assets/vehicles/german_transport.fbx' \
            'https://test.ivandpopov.com/grasstex/preview/strategic-interception-macro-20261016/Assets/vehicles/german_transport.fbx'
          do
            echo "ASSET CHECK: $origin"
            curl --location --silent --show-error --max-time 50 \
              --output "$RUNNER_TEMP/truck-preview-body" \
              --write-out "HTTP=%{http_code} TYPE=%{content_type} BYTES=%{size_download}\n" "$origin" || true
            wc -c "$RUNNER_TEMP/truck-preview-body" || true
          done
          git rm .github/workflows/temp-vehicle-url-audit.yml
          git config user.name grasstex-ci
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(preview): remove temporary truck-asset URL audit"
          git push origin HEAD:work/strategic-interception-macro-20261016
