name: Phase C locomotion paired seeds
on:
  push:
    branches:
      - work/phase-c-locomotion-ab-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    name: ${{ matrix.scenario.type }} seed ${{ matrix.scenario.seed }} autonomy=${{ matrix.locomotion }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - { type: meeting, seed: '1' }
          - { type: us-defend, seed: '1' }
          - { type: ge-defend, seed: '15' }
        locomotion: ['0', '1']
    steps:
      - uses: actions/checkout@v4
      - name: Install native Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start native full-battle server
        run: |
          set -euo pipefail
          mkdir -p /tmp/battle-www
          ln -s "$GITHUB_WORKSPACE" /tmp/battle-www/grasstex
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8765 -t /tmp/battle-www > /tmp/phase-c-locomotion-php.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=phase-c-health" > /dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/phase-c-locomotion-php.log
          exit 1
      - name: Same-seed natural C field replay
        env:
          C_FIELD_TYPE: ${{ matrix.scenario.type }}
          C_FIELD_SEED_INDEX: ${{ matrix.scenario.seed }}
          C_FIELD_COUNT: '1'
          C_FIELD_SECONDS: '600'
          C_FIELD_PREFIX: phase-c-natural-20261012
          C_FIELD_ARMS: on
          C_FIELD_AUTONOMOUS_MOVEMENT: ${{ matrix.locomotion }}
          C_FIELD_SMART_INGRESS: '0'
          C_FIELD_DIR: reports/phase-c-locomotion
          C_FIELD_SHA: ${{ github.sha }}
        run: node scripts/probes/probe_phase_c_natural.cjs
      - name: Save native telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locomotion-${{ matrix.scenario.type }}-${{ matrix.locomotion }}
          path: reports/phase-c-locomotion/*.json
          retention-days: 30
      - name: Server diagnostics
        if: failure()
        run: tail -100 /tmp/phase-c-locomotion-php.log || true
  compare:
    name: Compare paired natural outcomes
    needs: paired
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: locomotion-*
          path: paired-evidence
      - name: Validate identical battle seeds and compare outcomes
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const results=[];
          for(const type of ['meeting','us-defend','ge-defend']){
            const load=mode=>{
              const filename=path.join('paired-evidence','locomotion-'+type+'-'+mode,type+'.json');
              if(!fs.existsSync(filename))throw Error('Missing real natural replay: '+filename);
              const data=JSON.parse(fs.readFileSync(filename,'utf8'));
              if(data.autonomousMovement!==mode||data.smartIndoorIngress!=='0')throw Error('Incorrect intervention: '+filename);
              const observed=data.results.filter(x=>x.arm==='on');
              if(observed.length!==1||observed[0].writerConflicts)throw Error('Unexpected arm/ownership: '+filename);
              return {seed:observed[0].seed,fingerprint:observed[0].scenarioFingerprint,summary:data.arms.on};
            };
            const off=load('0'),on=load('1');
            // Regenerated fingerprints are structured objects. Compare their values,
            // not JavaScript object identity, which differs after JSON.parse.
            if(off.seed!==on.seed)throw Error('Seed mismatch: '+type);
            if(!off.fingerprint || !on.fingerprint)throw Error('Missing scenario fingerprint: '+type);
            require('node:assert/strict').deepStrictEqual(off.fingerprint,on.fingerprint,'Scenario fingerprint changed: '+type);
            results.push({type,seed:on.seed,fingerprint:on.fingerprint,off:off.summary,on:on.summary});
          }
          console.log('PHASE_C_LOCOMOTION_AB',JSON.stringify(results));
          fs.writeFileSync('phase-c-locomotion-ab.json',JSON.stringify(results,null,2));
          NODE
      - name: Upload comparison verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-c-locomotion-comparison
          path: phase-c-locomotion-ab.json
