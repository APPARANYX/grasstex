name: TEMP Fullscreen Map Recon Play Preview
on:
  push:
    branches: [work/strategic-interception-macro-20261016]
    paths: [.github/workflows/temp-fullmap-recon-preview.yml]
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Self-remove then publish exact branch preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-fullmap-recon-preview.yml
          git config user.name grasstex-ci
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(preview): self-remove fullscreen map publish dispatcher"
          git push origin HEAD:work/strategic-interception-macro-20261016
          echo "Exact branch tip $(git rev-parse HEAD)"
          gh workflow run deploy-50webs-preview.yml --ref main \
            -f ref=work/strategic-interception-macro-20261016 \
            -f lab_qa=false
          echo "Dispatched isolated branch-preview publisher; main untouched"
