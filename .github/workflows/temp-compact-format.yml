name: Temporary compact diagnostics formatter
on:
  push:
    branches:
      - work/compact-diagnostics-export

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes prettier@3.3.3 --write battle/modules/99-session-diagnostics-export.js
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "grasstex-format-bot"
          git config user.email "grasstex-format-bot@users.noreply.github.com"
          git add battle/modules/99-session-diagnostics-export.js
          git commit -m "Format compact diagnostics exporter"
          git push
