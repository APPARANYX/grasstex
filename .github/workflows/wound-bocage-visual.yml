name: Wound + Bocage Visual Validation

on:
  push:
    branches:
      - 'work/wound-bocage-closeout'

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIRECT_PREVIEW: https://test.ivandpopov.com/grasstex/preview.php?ref=work%2Fwound-bocage-closeout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prime full-asset direct preview
        run: curl -fsSL --max-time 240 "$DIRECT_PREVIEW" -o /dev/null

      - name: Validate live bocage height and occlusion
        env:
          BOCAGE_URL: ${{ env.DIRECT_PREVIEW }}
          BOCAGE_SEED: wound-bocage-preview
          BOCAGE_OUT: validation/bocage
        run: node scripts/probe_bocage_preview.cjs

      - name: Photograph a live wounded FBX soldier
        env:
          CLOSEUP_URL: ${{ env.DIRECT_PREVIEW }}
          CLOSEUP_SEED: wound-skin-preview
          CLOSEUP_TARGET: wounded
          CLOSEUP_COUNT: '1'
          CLOSEUP_AFTER: '3'
          CLOSEUP_VIEWS: front,left,right,back,top
          CLOSEUP_DIST: '1.2'
          CLOSEUP_WAIT: '360'
          CLOSEUP_OUT: validation/wound
        run: node scripts/closeup_battle.cjs

      - name: Photograph the wound surface directly
        env:
          CLOSEUP_URL: ${{ env.DIRECT_PREVIEW }}
          CLOSEUP_SEED: wound-skin-preview
          CLOSEUP_SHOTS: wound
          CLOSEUP_SIM: '360'
          CLOSEUP_BODY: '1'
          CLOSEUP_DIST: '0.7'
          CLOSEUP_FBX_WAIT: '180'
          CLOSEUP_OUT: validation/damage
        run: node scripts/closeup_damage_fx.cjs

      - name: Upload validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wound-bocage-visual-${{ github.run_number }}
          path: validation/
          if-no-files-found: warn
          retention-days: 14
