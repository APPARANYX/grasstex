name: Phase C credible firing base surgical validation
on:
  push:
    branches:
      - work/phase-c-credible-firing-base-20261014
    paths:
      - battle/modules/15o-squad-leader-tactical-postures.js
      - tools/ai-sim-harness/tactical-postures-check.js
      - .github/workflows/phase-c-credible-firing-base-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Parse surgical changes
        run: |
          node --check battle/modules/15o-squad-leader-tactical-postures.js
          node --check tools/ai-sim-harness/tactical-postures-check.js
      - name: Formatter standard for both changed source files
        run: npx --yes prettier@3.3.3 --check battle/modules/15o-squad-leader-tactical-postures.js tools/ai-sim-harness/tactical-postures-check.js
      - name: Phase C tactical regression
        run: |
          set -euo pipefail
          node tools/ai-sim-harness/tactical-postures-check.js
          node tools/ai-sim-harness/effective-fire-support-check.js
          node tools/ai-sim-harness/covered-pressure-bound-check.js
          node tools/ai-sim-harness/covered-fire-maneuver-causal-check.js
          node tools/ai-sim-harness/covered-bounds-check.js
      - name: All sim regressions
        run: |
          set -euo pipefail
          for check in tools/ai-sim-harness/*-check.js; do
            echo "--- $check"
            node "$check"
          done
