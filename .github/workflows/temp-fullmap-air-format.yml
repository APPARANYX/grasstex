name: TEMP Fullscreen Map Air Formatting
on:
  push:
    branches: [work/fullscreen-tacmap-air-recon-20261017]
    paths: [.github/workflows/temp-fullmap-air-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Format all updated JS and self-remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write \
            battle/modules/55-reported-contact-tactical-map.js \
            battle/modules/59-strategic-aerial-recon.js \
            battle/camera-controls.js \
            tools/ai-sim-harness/camera-input-frame-check.js \
            tools/ai-sim-harness/strategic-aerial-recon-check.js \
            scripts/probes/probe_tactical_map_ui.cjs \
            tools/ai-sim-harness/tactical-map-check.js
          git rm -- .github/workflows/temp-fullmap-air-format.yml
          git add -- battle/modules/55-reported-contact-tactical-map.js \
            battle/modules/59-strategic-aerial-recon.js \
            battle/camera-controls.js \
            tools/ai-sim-harness/camera-input-frame-check.js \
            tools/ai-sim-harness/strategic-aerial-recon-check.js \
            scripts/probes/probe_tactical_map_ui.cjs \
            tools/ai-sim-harness/tactical-map-check.js
          git config user.name grasstex-ci
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(map): format fullscreen map and air recon; remove temp workflow"
          git push origin HEAD:work/fullscreen-tacmap-air-recon-20261017
