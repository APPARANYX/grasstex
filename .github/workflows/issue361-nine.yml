name: #361 Nine-variant command and recon acceptance
on:
  push:
    branches:
      - 'work/audit-issue361/**'
permissions:
  contents: read
jobs:
  command:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue361-complete-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test full shipping recon and command lifecycle for 3 4 5 survivors
        run: |
          mkdir -p reports
          COMMAND_AUDIT_OUTPUT=reports/issue361-nine-variant.json node scripts/run_command_lifecycle_audit.cjs
      - name: Save full deterministic data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue361-nine-variant-audit
          path: reports/issue361-nine-variant.json
          if-no-files-found: warn
