name: Temporary concurrent cover formatting
on:
  pull_request:
    paths:
      - .github/workflows/tmp-concurrent-cover-format.yml
permissions:
  contents: read
jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: |
          npx --yes prettier@3.3.3 --write battle/tactical-capability-contract.js battle/modules/16-squad-plan-stability.js battle/modules/13e-tactical-covered-maneuver.js battle/engagement.js battle/skills-lab.js tools/ai-sim-harness/tactical-covered-maneuver-check.js battle/modules/41-squad-status-overlay.js
          node - <<'NODE'
          const fs=require('fs');
          for(const path of ['battle/tactical-capability-contract.js','battle/modules/16-squad-plan-stability.js','battle/modules/13e-tactical-covered-maneuver.js','battle/engagement.js','battle/skills-lab.js','tools/ai-sim-harness/tactical-covered-maneuver-check.js','battle/modules/41-squad-status-overlay.js'])
            console.log('FORMAT_HANDOFF '+JSON.stringify({path,content:fs.readFileSync(path,'utf8')}));
          NODE

# Format the revised individual-checkin regression fixtures at current PR head.
