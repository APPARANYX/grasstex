name: ⭐ Dispatch Phase C Standard Comparisons

# This workflow uses GitHub's own Actions API so all three real M3C benchmark
# runs appear under "M3C Standard Benchmark", not only our natural-field QA.
on:
  pull_request:
    # Heavy checks run when a draft is promoted for review, not on every push.
    types: [ready_for_review]
    paths:
      - .github/workflows/phase-c-m3c-dispatch.yml
      - battle/modules/15o-squad-leader-tactical-postures.js
      - battle/modules/15j-squad-leader-fire-and-movement.js
      - battle/modules/19-engagement-cover-positions.js
      - tools/ai-sim-harness/tactical-postures-check.js
      - scripts/probes/probe_phase_c_natural.cjs
  workflow_dispatch:

# A subsequent ready-for-review replaces any incomplete same-PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: M3C comparison — ${{ matrix.battle_type }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        battle_type: [meeting, us-defend, ge-defend]
    steps:
      - name: Dispatch pinned Phase C same-seed standard benchmark
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BATTLE_TYPE: ${{ matrix.battle_type }}
        run: |
          set -euo pipefail
          echo "M3C benchmark source: $REPO / $SOURCE_REF / $SOURCE_SHA"
          if [[ -n "$SOURCE_SHA" ]]; then
            got="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/branches/$SOURCE_REF" | jq -r '.commit.sha')"
            if [[ "$got" != "$SOURCE_SHA" ]]; then
              echo "::error::Ref changed; refusing to compare a different PR head: $got vs $SOURCE_SHA"
              exit 1
            fi
          fi
          payload="$(jq -n \
            --arg ref "$SOURCE_REF" \
            --arg type "$BATTLE_TYPE" \
            --arg correlation "phase-c-pr525-$SOURCE_SHA" \
            '{ref:$ref, inputs:{
              seed:"phase-c-natural-20261012",
              seeds:"3",
              query_off:"",
              query_on:"localPlan=1&localAmbush=1&localManeuver=1&coveredBounds=1",
              battle_type:$type,
              windows:"contact+60,every60",
              origin_agent:"chatgpt",
              correlation_id:$correlation,
              purpose:"Phase C #299/#525 final naturally seeded full-battle OFF/ON comparison (3 matched seeds)"
            }}')"
          http="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/actions/workflows/battle-benchmark-standard.yml/dispatches" \
            -d "$payload")"
          if [[ "$http" != '204' ]]; then
            cat /tmp/dispatch.json
            echo "::error::Benchmark dispatch refused with HTTP $http"
            exit 1
          fi
          echo "Submitted STANDARD M3C benchmark: $BATTLE_TYPE; 3 full-battle paired seeds; ref $SOURCE_REF at $SOURCE_SHA"
