name: Temporary hedge 420 covering-fire A/B
on:
  push:
    branches:
      - work/hedge420-covering-fire-trial
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise exact cover gates and physical firing-lane recovery
        run: |
          set -euo pipefail
          node --check battle/engagement.js
          node --check battle/modules/19-engagement-cover-positions.js
          node scripts/run_causal_inaction_benchmark.cjs --help || true
          node tools/ai-sim-harness/causal-inaction-check.js
          node tools/ai-sim-harness/cover-positions-check.js
          node tools/ai-sim-harness/hedgerow-firing-lane-check.js
  full-battle:
    strategy:
      fail-fast: false
      matrix:
        mode: ['off', 'cover']
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CAUSAL_BATTLES: meeting:hedge420-ambush-0001
      CAUSAL_SECONDS: '180'
      CAUSAL_FIXTURE: hedge-ambush-covered
      CAUSAL_CONTROL: '1'
      CAUSAL_QUERY: ${{ matrix.mode == 'cover' && 'coverPeek=1&coverPeekSupport=1' || 'coverPeek=0' }}
      CAUSAL_OUT: reports/hedge-420-supported-${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deterministic browser driver
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run shipping battle PHP server
        run: |
          set -euo pipefail
          mkdir -p /tmp/battle-www
          ln -s "$GITHUB_WORKSPACE" /tmp/battle-www/grasstex
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8765 -t /tmp/battle-www >/tmp/battle-php.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=healthcheck' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/battle-php.log
          exit 1
      - name: Report direct decisions and observer/control parity
        run: node scripts/run_causal_inaction_benchmark.cjs
      - name: Save causal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hedge-420-supported-${{ matrix.mode }}
          path: reports/hedge-420-supported-${{ matrix.mode }}/
          retention-days: 14
          if-no-files-found: warn
