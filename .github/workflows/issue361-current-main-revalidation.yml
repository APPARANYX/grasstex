name: Issue 361 current main verification
on:
  push:
    branches: [work/issue361-current-main-revalidation]
permissions:
  contents: read
jobs:
  hill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only full command / recon / terrain physical replay
        env:
          COMMAND_AUDIT_VARIANTS: scouts-alive,scouts-dead,three-men,prepared-garrison,secured-defender,blocked-recon,doctrine-defend
          COMMAND_AUDIT_SECONDS: '425'
          COMMAND_AUDIT_OUTPUT: reports/issue361/current-main.json
        run: |
          set -euo pipefail
          mkdir -p reports/issue361
          node scripts/run_command_lifecycle_audit.cjs | tee /tmp/issue361.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue361-current-main
          path: |
            reports/issue361/
            /tmp/issue361.log
          if-no-files-found: warn
          retention-days: 14
