name: TEMP strategic interception formatter
on:
  push:
    branches:
      - work/strategic-interception-macro-20261016
    paths:
      - .github/workflows/temp-intercept-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Format and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write \
            battle/commander-ai.js \
            battle/modules/15l-squad-leader-mission-execution.js \
            battle/modules/22a-commander-strategic-recovery.js \
            battle/modules/58-strategic-abstract-transport.js \
            battle/modules/59b-strategic-interception.js \
            tools/ai-sim-harness/strategic-interception-check.js
          git rm .github/workflows/temp-intercept-format.yml
          git add -- battle/commander-ai.js \
            battle/modules/15l-squad-leader-mission-execution.js \
            battle/modules/22a-commander-strategic-recovery.js \
            battle/modules/58-strategic-abstract-transport.js \
            battle/modules/59b-strategic-interception.js \
            tools/ai-sim-harness/strategic-interception-check.js
          git config user.name "grasstex-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(interception): format macro and transport integration; remove temp workflow"
          git push origin HEAD:work/strategic-interception-macro-20261016
