name: TEMP Format Stationary Air Recon
on:
  push:
    branches: [work/fullscreen-tacmap-air-recon-20261017]
    paths: [.github/workflows/temp-static-air-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Format recon, map, tests and self-remove
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write \
            battle/modules/55-reported-contact-tactical-map.js \
            battle/modules/59-strategic-aerial-recon.js \
            tools/ai-sim-harness/strategic-aerial-recon-check.js \
            scripts/probes/probe_tactical_map_ui.cjs
          git rm .github/workflows/temp-static-air-format.yml
          git add battle/modules/55-reported-contact-tactical-map.js \
            battle/modules/59-strategic-aerial-recon.js \
            tools/ai-sim-harness/strategic-aerial-recon-check.js \
            scripts/probes/probe_tactical_map_ui.cjs
          git config user.name grasstex-ci
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(recon): format stationary survey and self-remove temporary workflow"
          git push origin HEAD:work/fullscreen-tacmap-air-recon-20261017
