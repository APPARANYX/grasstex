name: ⭐ Deploy Battle Sim Branch Preview

# Publishes an in-progress branch to its own URL for visual checks:
#   https://test.ivandpopov.com/grasstex/preview/<branch-slug>/battle_sim.php
# Production (/grasstex/battle_sim.php, build tags, deploy hash state) is never touched. A preview reads
# production assets, policy and scenario memory, and makes no telemetry, policy or learning writes.

on:
  # Manual only: the production branch never deploys itself into a preview.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to preview (defaults to the selected branch)
        required: false
        default: ''
      lab_qa:
        description: Verify the native Combat Lab in hosted Chromium after preview upload
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-50webs-preview-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    name: Upload branch preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout preview ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Fetch production comparison tree
        shell: bash
        run: |
          set -euo pipefail
          # Compare complete git trees, not mtimes or sizes. This shallow fetch
          # works for old, diverged and rebased branches.
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Resolve preview identity
        id: id
        shell: bash
        env:
          PREVIEW_REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          slug="$(printf '%s' "$PREVIEW_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's#^(work|preview)/##; s#[^a-z0-9]+#-#g; s#^-+|-+$##g' | cut -c1-48)"
          test -n "$slug"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "ref=$PREVIEW_REF" >> "$GITHUB_OUTPUT"

      - name: Validate preview runtime
        shell: bash
        run: |
          set -euo pipefail
          php -l battle_sim_local.php
          php -l labs/asset-list.php
          # A loader without preview support would silently serve production scripts and write production logs.
          grep -q 'BATTLE_PREVIEW' battle_sim_local.php
          grep -q 'BATTLE_PREVIEW' battle/battle-telemetry.js
          grep -q 'BATTLE_PREVIEW' battle/ai-policy.js
          test -s battle/battle_sim.html
          for f in battle/*.js battle/modules/*.js; do node --check "$f"; done

      - name: Stage preview directory
        shell: bash
        env:
          PREVIEW_REF: ${{ steps.id.outputs.ref }}
          PREVIEW_SHA: ${{ steps.id.outputs.sha }}
        run: |
          set -euo pipefail
          rm -rf .preview && mkdir -p .preview/battle/modules
          cp battle_sim_local.php .preview/battle_sim.php
          cp battle/battle_sim.html battle/*.js .preview/battle/
          # The AI map viewer of this branch (reads the branch's own battle/*.js; ?a=<url>&b=<url> or ?bench=<run> loads benchmark results).
          cp ai_flow_live.html .preview/ai_flow_live.html
          cp battle/modules/*.js .preview/battle/modules/
          # Stage only branch-owned asset differences. The preview's Assets/.htaccess
          # routes absent files to the production Assets/ directory on the same host.
          # Never upload all ~850 MB of unchanged soldier/animation FBX files.
          python3 scripts/prepare_preview_asset_overlay.py --base-ref origin/main --output .preview
          mkdir -p .preview/Assets/soldiers
          cp .preview/asset-overlay.htaccess .preview/Assets/.htaccess
          # The Motion Lab workbench with its asset inventory + sidecar-save endpoints.
          if [ -d labs ]; then
            mkdir -p .preview/labs
            cp labs/fbx-animation-lab.html labs/fbx-animation-*.js labs/asset-list.php labs/save-calibration.php .preview/labs/
            if [ -f labs/vehicle-animation-lab.html ]; then cp labs/vehicle-animation-lab.html .preview/labs/; fi
          fi
          # A missing lab page previously made a green battle-preview job return a 404
          # on the lab URL. Verify optional lab payloads when they exist on the branch.
          if [[ -f labs/vehicle-animation-lab.html ]]; then
            test -s .preview/labs/vehicle-animation-lab.html
            grep -q 'Vehicle Animation Lab' .preview/labs/vehicle-animation-lab.html
          fi
          python3 - <<'PY'
          import json, os, datetime
          json.dump({"ref": os.environ["PREVIEW_REF"], "sha": os.environ["PREVIEW_SHA"],
                     "deployedAt": datetime.datetime.utcnow().isoformat() + "Z"},
                    open(".preview/preview.json", "w"))
          PY
          find .preview -type f | wc -l

      - name: Upload preview to 50webs
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASS }}
          SLUG: ${{ steps.id.outputs.slug }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Missing repository secret FTP_HOST}"
          : "${FTP_USER:?Missing repository secret FTP_USER}"
          : "${FTP_PASSWORD:?Missing repository secret FTP_PASS}"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Runtime files are branch-specific. Assets/ is a thin override: only
          # files whose git blob differs from main are staged. Always transfer staged
          # files (including same-size edits), while --delete removes obsolete prior
          # overrides only in THIS preview's Assets/ directory. Never delete sidecar
          # calibration JSON or user-saved lab files.
          # A preview's Assets/.htaccess transparently resolves all missing
          # soldier, animation, weapon and vehicle assets to production.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 15
          set ftp:ssl-allow no
          set ftp:passive-mode true
          cd grasstex
          mkdir -f -p preview/$SLUG
          cd preview/$SLUG
          lcd .preview
          mirror -R --delete --verbose=1 --exclude '\.json\$' --exclude '[Ll][Aa][Bb]' --exclude '[Ss][Ii][Dd][Ee][Cc][Aa][Rr]' battle battle
          mirror -R --verbose=1 labs labs
          mirror -R --delete --verbose=1 --transfer-all --exclude '\.json\
          put battle_sim.php
          put ai_flow_live.html
          put asset-overlay.json
          put preview.json
          bye
          LFTP

      - name: Verify preview is serving this commit
        shell: bash
        env:
          SLUG: ${{ steps.id.outputs.slug }}
          SHA: ${{ steps.id.outputs.sha }}
        run: |
          set -euo pipefail
          url="https://test.ivandpopov.com/grasstex/preview/$SLUG/battle_sim.php"
          body="$(curl -fsS "$url")"
          grep -q "preview-${SHA:0:7}" <<<"$body"
          grep -q "/grasstex/preview/$SLUG/battle/commander-ai.js" <<<"$body"
          # Fail a green preview job if unchanged FBX assets cannot resolve
          # through the preview overlay to the production copy.
          overlay_test_url="https://test.ivandpopov.com/grasstex/preview/$SLUG/Assets/soldiers/ge-paratrooper.fbx"
          curl --fail --silent --show-error --location --head "$overlay_test_url" >/dev/null
          overlay_metadata_url="https://test.ivandpopov.com/grasstex/preview/$SLUG/asset-overlay.json"
          overlay_metadata="$(curl -fsSL "$overlay_metadata_url")"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["assetOverlay"] and d["version"]==1' "$overlay_metadata"
          echo "Preview FBX overlay verified: $overlay_test_url"
          # The battle page is not enough: check the exact vehicle-lab URL as well.
          # This is conditional so an unrelated historical branch without the lab
          # remains previewable using the same generic workflow.
          if [[ -f labs/vehicle-animation-lab.html ]]; then
            vehicle_lab_url="https://test.ivandpopov.com/grasstex/preview/$SLUG/labs/vehicle-animation-lab.html"
            vehicle_lab_html="$(curl -fsSL "$vehicle_lab_url")"
            grep -q 'Vehicle Animation Lab' <<<"$vehicle_lab_html"
            inventory_url="https://test.ivandpopov.com/grasstex/preview/$SLUG/labs/asset-list.php"
            inventory="$(curl -fsSL "$inventory_url")"
            grep -q 'german_transport.fbx' <<<"$inventory"
            for clip in 'Truck - Driving.fbx' 'Truck - Sitting 1.fbx' 'Truck - Sitting 2.fbx' 'Truck - Sitting 3.fbx'; do
              if [[ -f "Assets/animations/$clip" ]]; then
                grep -Fq "$clip" <<<"$inventory"
              fi
            done
            echo "Vehicle Animation Lab preview and vehicle/animation inventory verified: $vehicle_lab_url"
          fi
          if [[ "${{ inputs.lab_qa }}" == "true" ]]; then
            lab="$(curl -fsSL "$url?combatLab=1")"
            grep -q 'window.PHASE_C_COMBAT_LAB=true' <<<"$lab"
            grep -q "/grasstex/preview/$SLUG/battle/phase-c-compact-range.js" <<<"$lab"
            module_url="https://test.ivandpopov.com/grasstex/preview/$SLUG/battle/phase-c-compact-range.js"
            curl --fail --silent --show-error --location "$module_url" -o /tmp/phase-c-preview-module.js
            test "$(wc -c </tmp/phase-c-preview-module.js)" -gt 10000
            grep -q 'Preview-only Phase C Combat Lab' /tmp/phase-c-preview-module.js
            grep -q 'window.PhaseCCombatLab.attachBattle(battle,scene,camera)' <<<"$lab"
          fi
          {
            echo "### Battle Sim preview"
            echo "- Ref: \`${{ steps.id.outputs.ref }}\` @ \`${SHA:0:7}\`"
            echo "- Meeting: $url"
            echo "- US defending: $url?defender=us"
            echo "- German defending: $url?defender=ge"
            if [[ -f labs/vehicle-animation-lab.html ]]; then
              echo "- Vehicle Animation Lab: https://test.ivandpopov.com/grasstex/preview/$SLUG/labs/vehicle-animation-lab.html"
            fi
            echo "- Asset upload: only branch-changed FBX/GLB/PNG/BIN; unchanged assets reused from production."
            echo "- Production untouched; preview makes no telemetry, policy or learning writes."
          } >> "$GITHUB_STEP_SUMMARY"

  combat-lab-smoke:
    name: Native Combat Lab Chromium QA
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lab_qa == true }}
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Resolve preview Combat Lab URL
        shell: bash
        env:
          PREVIEW_REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$PREVIEW_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's#^(work|preview)/##; s#[^a-z0-9]+#-#g; s#^-+|-+$##g' | cut -c1-48)"
          test -n "$slug"
          echo "PHASE_C_LAB_URL=https://test.ivandpopov.com/grasstex/preview/$slug/battle_sim.php" >> "$GITHUB_ENV"
      - name: Install Chromium harness
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify native range and isolation in hosted browser
        run: node scripts/probes/phase_c_combat_lab_smoke.cjs
      - name: Publish screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-c-native-lab-smoke
          path: reports/phase-c-lab/
          if-no-files-found: ignore
 --exclude '[Ll][Aa][Bb]' --exclude '[Ss][Ii][Dd][Ee][Cc][Aa][Rr]' Assets Assets
          put battle_sim.php
          put ai_flow_live.html
          put preview.json
          bye
          LFTP

      - name: Verify preview is serving this commit
        shell: bash
        env:
          SLUG: ${{ steps.id.outputs.slug }}
          SHA: ${{ steps.id.outputs.sha }}
        run: |
          set -euo pipefail
          url="https://test.ivandpopov.com/grasstex/preview/$SLUG/battle_sim.php"
          body="$(curl -fsS "$url")"
          grep -q "preview-${SHA:0:7}" <<<"$body"
          grep -q "/grasstex/preview/$SLUG/battle/commander-ai.js" <<<"$body"
          # The battle page is not enough: check the exact vehicle-lab URL as well.
          # This is conditional so an unrelated historical branch without the lab
          # remains previewable using the same generic workflow.
          if [[ -f labs/vehicle-animation-lab.html ]]; then
            vehicle_lab_url="https://test.ivandpopov.com/grasstex/preview/$SLUG/labs/vehicle-animation-lab.html"
            vehicle_lab_html="$(curl -fsSL "$vehicle_lab_url")"
            grep -q 'Vehicle Animation Lab' <<<"$vehicle_lab_html"
            inventory_url="https://test.ivandpopov.com/grasstex/preview/$SLUG/labs/asset-list.php"
            inventory="$(curl -fsSL "$inventory_url")"
            grep -q 'german_transport.fbx' <<<"$inventory"
            for clip in 'Truck - Driving.fbx' 'Truck - Sitting 1.fbx' 'Truck - Sitting 2.fbx' 'Truck - Sitting 3.fbx'; do
              if [[ -f "Assets/animations/$clip" ]]; then
                grep -Fq "$clip" <<<"$inventory"
              fi
            done
            echo "Vehicle Animation Lab preview and vehicle/animation inventory verified: $vehicle_lab_url"
          fi
          if [[ "${{ inputs.lab_qa }}" == "true" ]]; then
            lab="$(curl -fsSL "$url?combatLab=1")"
            grep -q 'window.PHASE_C_COMBAT_LAB=true' <<<"$lab"
            grep -q "/grasstex/preview/$SLUG/battle/phase-c-compact-range.js" <<<"$lab"
            module_url="https://test.ivandpopov.com/grasstex/preview/$SLUG/battle/phase-c-compact-range.js"
            curl --fail --silent --show-error --location "$module_url" -o /tmp/phase-c-preview-module.js
            test "$(wc -c </tmp/phase-c-preview-module.js)" -gt 10000
            grep -q 'Preview-only Phase C Combat Lab' /tmp/phase-c-preview-module.js
            grep -q 'window.PhaseCCombatLab.attachBattle(battle,scene,camera)' <<<"$lab"
          fi
          {
            echo "### Battle Sim preview"
            echo "- Ref: \`${{ steps.id.outputs.ref }}\` @ \`${SHA:0:7}\`"
            echo "- Meeting: $url"
            echo "- US defending: $url?defender=us"
            echo "- German defending: $url?defender=ge"
            if [[ -f labs/vehicle-animation-lab.html ]]; then
              echo "- Vehicle Animation Lab: https://test.ivandpopov.com/grasstex/preview/$SLUG/labs/vehicle-animation-lab.html"
            fi
            echo "- Production untouched; preview makes no telemetry, policy or learning writes."
          } >> "$GITHUB_STEP_SUMMARY"

  combat-lab-smoke:
    name: Native Combat Lab Chromium QA
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lab_qa == true }}
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Resolve preview Combat Lab URL
        shell: bash
        env:
          PREVIEW_REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$PREVIEW_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's#^(work|preview)/##; s#[^a-z0-9]+#-#g; s#^-+|-+$##g' | cut -c1-48)"
          test -n "$slug"
          echo "PHASE_C_LAB_URL=https://test.ivandpopov.com/grasstex/preview/$slug/battle_sim.php" >> "$GITHUB_ENV"
      - name: Install Chromium harness
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify native range and isolation in hosted browser
        run: node scripts/probes/phase_c_combat_lab_smoke.cjs
      - name: Publish screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-c-native-lab-smoke
          path: reports/phase-c-lab/
          if-no-files-found: ignore
