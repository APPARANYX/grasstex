name: ⭐ Generate voice callouts

# Generates the voice lines that Assets/audio/manifest.json scripts (callouts.<side>.generation) but that do not
# exist yet, with ElevenLabs (scripts/generate_voice_callouts.py: same voices, model and settings as every line
# before), masters them (scripts/normalize_audio.sh, the voice target) and commits them to the branch that ran.
# It only ever adds missing files: a line that already exists is never regenerated or touched.
#
# Runs only when started by hand (Actions > Run workflow), never on a push: ElevenLabs is called only on a
# person's say-so. It needs the repository
# secret ELEVEN_LABS_API (ELEVENLABS_API_KEY also works); without it the run says so and stops without failing. It never runs on main
# (main deploys to production on every push).

on:
  workflow_dispatch:
    inputs:
      max_new:
        description: "Most missing clips one run may generate (default 12; 0 = no cap). Raise only for an intended bulk run."
        required: false
        default: ""
        type: string
      faction:
        description: "Only one side (us or ge); blank for both"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: voice-callouts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Check the API key
        id: key
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVEN_LABS_API || secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "Repository secret ELEVEN_LABS_API is not set: nothing generated." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ffmpeg
        if: steps.key.outputs.ok == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Every clip must be present before generating, or the generator sees the library as missing and
      # regenerates it (it once re-ran all 58 combat clips); and before mastering: normalize_audio.sh drops the .mastering-state.tsv
      # line of every file it cannot find, and check_audio_manifest.py needs them. Overlaid from the
      # private APPARANYX/grasstex-audio (gitignored, so `git add` never commits them).
      - name: Pinned private audio commit
        id: private-audio
        if: steps.key.outputs.ok == 'true'
        run: echo "commit=$(python3 -c 'import json;print(json.load(open("Assets/audio/private-audio.lock.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the private audio
        if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: APPARANYX/grasstex-audio
          ref: ${{ steps.private-audio.outputs.commit }}
          ssh-key: ${{ secrets.PRIVATE_AUDIO_READ_KEY || secrets.AUDIO_PRIVATE_WRITE_KEY }}
          path: .runtime/private-audio
          persist-credentials: false

      - name: Overlay the private audio
        if: steps.key.outputs.ok == 'true'
        run: bash scripts/fetch_private_audio.sh .runtime/private-audio

      - name: Generate the missing lines
        if: steps.key.outputs.ok == 'true'
        env:
          GENERATE_MAX_NEW: ${{ inputs.max_new }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVEN_LABS_API || secrets.ELEVENLABS_API_KEY }}
          FACTION: ${{ inputs.faction }}
        run: |
          set -euo pipefail
          if [ -n "${FACTION:-}" ]; then
            python3 scripts/generate_voice_callouts.py --faction "$FACTION" | tee "$RUNNER_TEMP/generate.log"
          else
            python3 scripts/generate_voice_callouts.py | tee "$RUNNER_TEMP/generate.log"
          fi
          tail -n 3 "$RUNNER_TEMP/generate.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Master and check
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          bash scripts/normalize_audio.sh Assets/audio
          python3 scripts/validate_voice_manifest.py
          python3 scripts/check_audio_manifest.py

      # New clips go to the private APPARANYX/grasstex-audio (never this public repo): push them there with
      # the write deploy key and pin the new commit in Assets/audio/private-audio.lock.json, which the next
      # step commits here with the mastering state.
      - name: Check out the private audio for publishing
        if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: APPARANYX/grasstex-audio
          ref: main
          ssh-key: ${{ secrets.AUDIO_PRIVATE_WRITE_KEY }}
          path: .runtime/private-audio-publish

      - name: Publish new clips to the private audio
        id: publish
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          bash scripts/publish_private_audio.sh .runtime/private-audio-publish | tee "$RUNNER_TEMP/publish.log"
          echo "count=$(sed -n 's/^published=//p' "$RUNNER_TEMP/publish.log")" >> "$GITHUB_OUTPUT"

      - name: Commit the new lines
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          git add Assets/audio
          if git diff --cached --quiet; then
            echo "No new lines: every scripted line already exists." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          n="${{ steps.publish.outputs.count }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git commit -m "Voice: generate $n scripted callout lines (ElevenLabs, mastered)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Committed $n new voice lines to ${GITHUB_REF_NAME}." | tee -a "$GITHUB_STEP_SUMMARY"
