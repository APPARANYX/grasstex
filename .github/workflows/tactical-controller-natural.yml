name: ⭐ New Tactical Controller Natural A-B
on:
  pull_request:
    paths:
      - battle/modules/13c-tactical-march-provider.js
      - battle/modules/13d-tactical-contact-skills.js
      - battle/modules/13e-tactical-covered-maneuver.js
      - scripts/probes/probe_tactical_controller_natural.cjs
      - .github/workflows/tactical-controller-natural.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-preview:
    uses: ./.github/workflows/deploy-50webs-preview.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
  natural:
    needs: exact-preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        battle: [meeting, us-defend, ge-defend]
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Pinned same-seed OFF versus new-controller ON
        env:
          TC_NATURAL_URL: https://test.ivandpopov.com/grasstex/preview/${{ needs.exact-preview.outputs.preview_slug }}/battle_sim.php
          TC_NATURAL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TC_NATURAL_TYPE: ${{ matrix.battle }}
          TC_NATURAL_COUNT: '3'
          TC_NATURAL_SECONDS: '300'
          TC_NATURAL_PREFIX: controller-natural-20261026
        run: node scripts/probes/probe_tactical_controller_natural.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-natural-${{ matrix.battle }}
          path: reports/tactical-controller-natural/
