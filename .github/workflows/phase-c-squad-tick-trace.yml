name: Phase C Focused Per-Tick Squad Trace
on:
  pull_request:
    paths:
      - scripts/probes/probe_phase_c_natural.cjs
      - .github/workflows/phase-c-squad-tick-trace.yml
      - battle/engagement.js
      - battle/modules/15a-squad-leader-fire-control.js
      - battle/modules/15o-squad-leader-tactical-postures.js
      - battle/modules/15j-squad-leader-fire-and-movement.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tick-trace:
    name: Natural ${{ matrix.seed_index }} ${{ matrix.squad }} every 0.15s
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: defender-us0-0017
            battle_type: us-defend
            seed_index: '17'
            squad: us:us-0
            seconds: '465'
            trace_from: '444'
            trace_to: '456'
          - label: attacker-ge2-0001
            battle_type: us-defend
            seed_index: '1'
            squad: ge:ge-2
            seconds: '305'
            trace_from: '285'
            trace_to: '300'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start full-battle server
        run: |
          set -euo pipefail
          mkdir -p /tmp/battle-www
          ln -s "$GITHUB_WORKSPACE" /tmp/battle-www/grasstex
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8765 -t /tmp/battle-www > /tmp/phase-c-trace-php.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=phase-c-health" > /dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/phase-c-trace-php.log
          exit 1
      - name: Read-only exact-seed per-tick causality trace
        env:
          C_FIELD_TYPE: ${{ matrix.battle_type }}
          C_FIELD_COUNT: '1'
          C_FIELD_SECONDS: ${{ matrix.seconds }}
          C_FIELD_PREFIX: phase-c-natural-20261012
          C_FIELD_SEED_INDEX: ${{ matrix.seed_index }}
          C_FIELD_ARMS: on
          C_FIELD_TRACE_SQUAD: ${{ matrix.squad }}
          C_FIELD_TRACE_FROM: ${{ matrix.trace_from }}
          C_FIELD_TRACE_TO: ${{ matrix.trace_to }}
          C_FIELD_DIR: reports/phase-c-tick-trace
          C_FIELD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/probes/probe_phase_c_natural.cjs
      - name: Upload every-tick evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-c-natural-${{ matrix.label }}-tick-trace
          path: reports/phase-c-tick-trace/*.json
          retention-days: 30
      - name: Server diagnostics
        if: failure()
        run: tail -100 /tmp/phase-c-trace-php.log || true
