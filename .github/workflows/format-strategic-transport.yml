name: Temporary transport formatting
on:
  push:
    branches:
      - work/strategic-abstract-transport-20261016
    paths:
      - .github/workflows/format-strategic-transport.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/strategic-abstract-transport-20261016
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact CI Prettier to two new files
        run: |
          npx --yes prettier@3.3.3 --write \
            battle/modules/58-strategic-abstract-transport.js \
            tools/ai-sim-harness/strategic-transport-check.js
      - name: Commit source formatting only
        run: |
          if ! git diff --quiet -- battle/modules/58-strategic-abstract-transport.js tools/ai-sim-harness/strategic-transport-check.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add battle/modules/58-strategic-abstract-transport.js tools/ai-sim-harness/strategic-transport-check.js
            git commit -m 'style(transport): apply repository Prettier rules'
            git push origin HEAD:work/strategic-abstract-transport-20261016
          fi
