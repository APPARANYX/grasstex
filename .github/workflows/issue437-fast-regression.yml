name: Issue 437 fast isolated-retreat regression
on:
  push:
    branches:
      - 'work/fix437-isolated-retreat-fallback'
    paths:
      - '.github/workflows/issue437-fast-regression.yml'
      - 'tools/ai-sim-harness/retreat-lost-contact-check.js'
      - 'battle/modules/15h-squad-leader-fireteams.js'
      - 'battle/modules/16-squad-plan-stability.js'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/ai-sim-harness/retreat-lost-contact-check.js
