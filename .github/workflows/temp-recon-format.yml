name: TEMP aerial recon formatter
on:
  push:
    branches:
      - work/strategic-interception-macro-20261016
    paths:
      - .github/workflows/temp-recon-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Format aerial recon and self-remove
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write battle/modules/59-strategic-aerial-recon.js
          git rm .github/workflows/temp-recon-format.yml
          git add battle/modules/59-strategic-aerial-recon.js
          git config user.name "grasstex-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(recon): format aerial reconnaissance and remove temporary workflow"
          git push origin HEAD:work/strategic-interception-macro-20261016
