name: Temporary movement fixture formatter 2
on:
  push:
    branches:
      - 'work/experimental-movement-substeps'
    paths:
      - '.github/workflows/temporary-format-movement-fixtures2.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/experimental-movement-substeps
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format updated production-source regression fixtures
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write tools/ai-sim-harness/personal-space-check.js tools/ai-sim-harness/window-port-check.js tools/ai-sim-harness/tactical-positions-check.js tools/ai-sim-harness/objective-nav-check.js
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add tools/ai-sim-harness/personal-space-check.js tools/ai-sim-harness/window-port-check.js tools/ai-sim-harness/tactical-positions-check.js tools/ai-sim-harness/objective-nav-check.js
          if ! git diff --cached --quiet; then
            git commit -m "Apply pinned Prettier to movement source regression fixtures"
            git push origin HEAD:work/experimental-movement-substeps
          fi
