name: Temporary issue 361 local-stall Prettier formatting
on:
  push:
    branches:
      - work/issue361-local-format
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format only experimental mission-review source and test
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write battle/modules/22a-commander-strategic-recovery.js tools/ai-sim-harness/issue361-local-stall-repro.js
          git config user.name 'grasstex-ci[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add battle/modules/22a-commander-strategic-recovery.js tools/ai-sim-harness/issue361-local-stall-repro.js
          if ! git diff --cached --quiet; then
            git commit -m "Format issue 361 local mission review with pinned Prettier"
            git push origin HEAD:refs/heads/work/issue361-local-format
          fi
