name: One-shot screen-space squad formatter
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
  pull-requests: read
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/screen-space-squad-edge-bearings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Run overlay regression, format changes and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          node tools/ai-sim-harness/squad-status-overlay-check.js
          npx --yes prettier@3.3.3 --write \
            battle/modules/41-squad-status-overlay.js \
            tools/ai-sim-harness/squad-status-overlay-check.js
          node tools/ai-sim-harness/squad-status-overlay-check.js
          rm .github/workflows/one-shot-screen-space-squad-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- battle/modules/41-squad-status-overlay.js \
            tools/ai-sim-harness/squad-status-overlay-check.js \
            .github/workflows/one-shot-screen-space-squad-format.yml
          git commit -m "Format tested screen-space squad edge projection"
          git push origin HEAD:${{ github.head_ref }}
