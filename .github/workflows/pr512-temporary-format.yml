name: PR512 temporary format export
on:
  pull_request:
    branches: [main]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format touched JS
        run: npx --yes prettier@3.3.3 --write battle/modules/15n-squad-leader-local-plan.js battle/modules/15l-squad-leader-mission-execution.js battle/modules/16-squad-plan-stability.js tools/ai-sim-harness/local-mission-tasks-check.js
      - name: Export formatted files
        run: |
          echo 'PR512_0_BEGIN'
          base64 -w0 battle/modules/15n-squad-leader-local-plan.js
          echo
          echo 'PR512_0_END'
          echo 'PR512_1_BEGIN'
          base64 -w0 battle/modules/15l-squad-leader-mission-execution.js
          echo
          echo 'PR512_1_END'
          echo 'PR512_2_BEGIN'
          base64 -w0 battle/modules/16-squad-plan-stability.js
          echo
          echo 'PR512_2_END'
          echo 'PR512_3_BEGIN'
          base64 -w0 tools/ai-sim-harness/local-mission-tasks-check.js
          echo
          echo 'PR512_3_END'
