name: M3C Standard Benchmark

# One scripted scenario, two arms. The same seed is stepped unmeasured to first contact, measured for 60 simulated
# seconds, then run to the end of the battle with a record at every 60 simulated seconds and at the end (`windows`), once
# with the flags of the OFF arm and once with those of the ON arm. Both arms run one after the other on one runner, so wall time is comparable, and the
# records are compared with scripts/compare_benchmark_arms.cjs. Every record carries all the benchmark's stats and
# telemetry (health, stalls, loops, combat, `timeline`, `stress`), counted inside its window. Nothing is published to
# the benchmark-results branch: the report is the run summary and the artifact.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Scenario seed, used exactly as given. A battle that ends early just has fewer checkpoint records.
        required: false
        default: 'scripted-scout-0003'
      query_off:
        description: Page flags for the OFF arm (e.g. morale=0 for the flat retreat). Empty is the default battle.
        required: false
        default: ''
      query_on:
        description: Page flags for the ON arm (e.g. coa=1). Empty for both is a control, and the two arms must be identical.
        required: false
        default: ''
      battle_type:
        description: meeting, us-defend or ge-defend
        required: false
        default: 'meeting'
      windows:
        description: Measured windows, comma separated - <contact|second>+<seconds>, or every<seconds> last (a record at every multiple of it, and at the end)
        required: false
        default: 'contact+60,every60'

permissions:
  contents: read

jobs:
  benchmark:
    name: Scripted scenario, off vs on
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BATTLE_BENCHMARK_SOURCE_SHA: ${{ github.sha }}
      BATTLE_BENCHMARK_COUNT: '1'
      BATTLE_BENCHMARK_TIME_LIMIT: '600'
      BATTLE_BENCHMARK_STEP: '0.15'
      BATTLE_BENCHMARK_WINDOWS: ${{ github.event.inputs.windows || 'contact+60,every60' }}
      BATTLE_BENCHMARK_SEED: ${{ github.event.inputs.seed || 'scripted-scout-0003' }}
      BATTLE_TYPE: ${{ github.event.inputs.battle_type || 'meeting' }}
      QUERY_OFF: ${{ github.event.inputs.query_off || '' }}
      QUERY_ON: ${{ github.event.inputs.query_on || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local battle server
        run: |
          php -v
          rm -rf /tmp/battle-www
          mkdir -p /tmp/battle-www
          ln -s "$GITHUB_WORKSPACE" /tmp/battle-www/grasstex
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8765 -t /tmp/battle-www >/tmp/battle-php.log 2>&1 &
          echo $! > /tmp/battle-php.pid
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=healthcheck" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/battle-php.log
          exit 1

      - name: Run both arms
        run: |
          set -euo pipefail
          case "$BATTLE_TYPE" in
            meeting) defender_query='' ;;
            us-defend) defender_query='defender=us' ;;
            ge-defend) defender_query='defender=ge' ;;
            *) echo "Unknown battle type: $BATTLE_TYPE" >&2; exit 2 ;;
          esac
          for arm in off on; do
            if [ "$arm" = off ]; then extra="$QUERY_OFF"; else extra="$QUERY_ON"; fi
            extra="${extra#[?&]}"
            query="$defender_query"
            if [ -n "$extra" ]; then if [ -n "$query" ]; then query="${query}&${extra}"; else query="$extra"; fi; fi
            export BATTLE_BENCHMARK_URL="http://127.0.0.1:8765/grasstex/battle_sim_local.php${query:+?$query}"
            export BATTLE_BENCHMARK_OUTPUT="reports/$arm"
            echo "::group::arm ${arm} (${query:-no flags}), seed ${BATTLE_BENCHMARK_SEED}, windows ${BATTLE_BENCHMARK_WINDOWS}"
            node scripts/run_battle_benchmark.mjs
            echo "::endgroup::"
          done

      - name: Compare the arms
        run: |
          set -uo pipefail
          counters=(
            usKills geKills fire.total fire.hits retreatSamples movementResolver.changes
            movementStalls.length routeStalls.length targetlessStalls.length vacantObjectiveStalls.length loopAlerts.length writerConflicts
            regroups.entries stallOutcomes.wakes stallOutcomes.repeats timeline.stalledOnsets timeline.stalledSamples
          )
          args=(); for c in "${counters[@]}"; do args+=(--count "$c"); done
          set +e
          node scripts/compare_benchmark_arms.cjs "${args[@]}" reports/off/battle-benchmark.json reports/on/battle-benchmark.json > reports/compare.json
          rc=$?
          set -e
          echo "compare exit ${rc}"
          echo "$rc" > reports/compare.rc
          exit 0

      - name: Publish run summary
        if: always()
        run: |
          {
            echo "## Scripted scenario: \`${BATTLE_BENCHMARK_SEED}\` (${BATTLE_TYPE}), windows \`${BATTLE_BENCHMARK_WINDOWS}\`"
            echo
            echo "- **OFF** arm flags: \`${QUERY_OFF:-none}\`"
            echo "- **ON** arm flags: \`${QUERY_ON:-none}\`"
            echo
            if [ -f reports/compare.json ]; then
              echo "### Paired comparison (a = off, b = on)"
              echo
              echo "Exit $(cat reports/compare.rc 2>/dev/null || echo '?') (1 means a runtime error or a median wall-time slowdown above 25%). \`unpaired\` counts windows only one arm reached: a flag that changes how long the battle lasts shows up there."
              echo
              echo '```json'
              cat reports/compare.json
              echo
              echo '```'
            fi
            for arm in off on; do
              if [ -f "reports/$arm/battle-benchmark.md" ]; then
                echo
                echo "<details><summary>${arm} arm report</summary>"
                echo
                cat "reports/$arm/battle-benchmark.md"
                echo
                echo "</details>"
              else
                echo
                echo "**The ${arm} arm produced no report.**"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripted-benchmark-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the run when the comparison failed its gate
        run: |
          rc="$(cat reports/compare.rc 2>/dev/null || echo 2)"
          if [ "$rc" != 0 ]; then echo "compare_benchmark_arms.cjs exited ${rc}" >&2; exit 1; fi

      - name: Show server log on failure
        if: failure()
        run: tail -n 300 /tmp/battle-php.log || true

  notify:
    name: Notify benchmark result
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send ntfy notification
        env:
          RESULT: ${{ needs.benchmark.result }}
          SEED: ${{ github.event.inputs.seed || 'scripted-scout-0003' }}
          QUERY_OFF: ${{ github.event.inputs.query_off || '' }}
          QUERY_ON: ${{ github.event.inputs.query_on || '' }}
          SOURCE_REF: ${{ github.ref_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = success ]; then status='COMPLETE'; tags='white_check_mark,crossed_swords'; priority='default'; else status="FAILED (${RESULT})"; tags='x,warning'; priority='high'; fi
          curl -fsS \
            -H "Title: M3C scripted benchmark #${GITHUB_RUN_NUMBER}" \
            -H "Priority: ${priority}" \
            -H "Tags: ${tags}" \
            -H "Click: ${RUN_URL}" \
            -d "${status} · ${SEED} · off [${QUERY_OFF:-none}] vs on [${QUERY_ON:-none}] · ${SOURCE_REF}" \
            https://ntfy.sh/ww2battlesim
