name: M3C Standard Benchmark

# Two arms, off and on, on the same seed or seeds, compared with scripts/compare_benchmark_arms.cjs and processed by
# scripts/process_benchmark_results.cjs into one result (a verdict, the paired table, the seeds that part earliest, slim files for
# the viewer). The result is the head of the run summary, goes to the benchmark-results branch under
# benchmarks/results/scripted/runs/<run>/ (scripts/publish_benchmark_result.sh; the 100-battle record in
# benchmarks/results/standard is not touched) and is what the notification links: ai_flow_live.html?bench=<run> on the preview of the
# branch that ran, both arms loaded. Every record carries all the benchmark's stats and telemetry (health, stalls, loops, combat,
# `timeline`, `stress`), counted inside its window; the artifacts keep them whole.
#
# seeds = 1 (the default), one scripted scenario: the seed is used exactly as given, stepped unmeasured to first contact,
#   measured for 60 simulated seconds, then run to the end of the battle with a record at every 60 simulated seconds and at the
#   end (`windows`). Both arms run one after the other on one job, so wall time is comparable. About 2 minutes. It shows that a
#   change is inert and where an arm first parts from the other; one battle per arm carries no rate.
#
# seeds = N > 1, a paired run across seeds: `seed` is a prefix, the seeds are `<prefix>-0001` to `<prefix>-<N>`, spread over up to
#   20 shards that each play their seeds with both arms on one runner, `windows` (default contact+120: the first two minutes of
#   fighting, not the whole battle). A last job pools the shards and reports each counter paired by seed. About 3.5 minutes for 100.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Scenario seed, used exactly as given (seeds 1; default scripted-scout-0003), or the prefix of the seeds (seeds above 1; default scripted-seeds)
        required: false
        default: ''
      seeds:
        description: How many seeds. 1 is the scripted scenario; more is a paired run across seeds, spread over up to 20 shards (e.g. 100)
        required: false
        default: '1'
      query_off:
        description: Page flags for the OFF arm (e.g. morale=0 for the flat retreat). Empty is the default battle.
        required: false
        default: ''
      query_on:
        description: Page flags for the ON arm (e.g. coa=1). Empty for both is a control, and the two arms must be identical.
        required: false
        default: ''
      battle_type:
        description: meeting, us-defend or ge-defend
        required: false
        default: 'meeting'
      windows:
        description: Measured windows, comma separated - <contact|second>+<seconds>, or every<seconds> last (a record at every multiple of it, and at the end). Default contact+60,every60 for one seed, contact+120 for several.
        required: false
        default: ''
      origin_agent:
        description: Who requested the benchmark (chatgpt, claude-code, human, etc.)
        required: false
        default: 'human'
      correlation_id:
        description: Opaque ID tying this run back to the investigation that requested it
        required: false
        default: ''
      purpose:
        description: Short description of the question this benchmark is intended to answer
        required: false
        default: ''

permissions:
  contents: read

env:
  # The counters the paired report adds up per record (compare_benchmark_arms.cjs --count).
  BENCH_COUNTERS: >-
    casualties usKills geKills fire.total fire.hits retreatSamples movementResolver.changes
    movementStalls.length routeStalls.length targetlessStalls.length vacantObjectiveStalls.length loopAlerts.length writerConflicts
    regroups.entries stallOutcomes.wakes stallOutcomes.repeats timeline.stalledOnsets timeline.stalledSamples
    recon.orders recon.contacts recon.noContact recon.timeouts recon.cancelled recon.reportsDelivered recon.retriggerBlocked
    squadPerformance.meanOverall squadPerformance.p10Overall squadPerformance.lowScoreSquads
    squadPerformance.meanMission squadPerformance.meanMovement squadPerformance.meanControl squadPerformance.meanCohesion

jobs:
  # ---- one seed: the scripted scenario ------------------------------------------------------------------------------------
  single:
    name: Scripted scenario, off vs on
    if: ${{ (github.event.inputs.seeds || '1') == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      headline: ${{ steps.process.outputs.headline }}
      viewer: ${{ steps.publish.outputs.viewer }}
      viewer_preview: ${{ steps.publish.outputs.viewer_preview }}
    env:
      BATTLE_BENCHMARK_SOURCE_SHA: ${{ github.sha }}
      BATTLE_BENCHMARK_COUNT: '1'
      BATTLE_BENCHMARK_TIME_LIMIT: '600'
      BATTLE_BENCHMARK_STEP: '0.15'
      BATTLE_BENCHMARK_WINDOWS: ${{ github.event.inputs.windows || 'contact+60,every60' }}
      BATTLE_BENCHMARK_SEED: ${{ github.event.inputs.seed || 'scripted-scout-0003' }}
      BATTLE_TYPE: ${{ github.event.inputs.battle_type || 'meeting' }}
      QUERY_OFF: ${{ github.event.inputs.query_off || '' }}
      QUERY_ON: ${{ github.event.inputs.query_on || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local battle server
        run: |
          php -v
          rm -rf /tmp/battle-www
          mkdir -p /tmp/battle-www
          ln -s "$GITHUB_WORKSPACE" /tmp/battle-www/grasstex
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8765 -t /tmp/battle-www >/tmp/battle-php.log 2>&1 &
          echo $! > /tmp/battle-php.pid
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=healthcheck" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/battle-php.log
          exit 1

      - name: Run both arms
        run: |
          set -euo pipefail
          case "$BATTLE_TYPE" in
            meeting) defender_query='' ;;
            us-defend) defender_query='defender=us' ;;
            ge-defend) defender_query='defender=ge' ;;
            *) echo "Unknown battle type: $BATTLE_TYPE" >&2; exit 2 ;;
          esac
          for arm in off on; do
            if [ "$arm" = off ]; then extra="$QUERY_OFF"; else extra="$QUERY_ON"; fi
            extra="${extra#[?&]}"
            query="$defender_query"
            if [ -n "$extra" ]; then if [ -n "$query" ]; then query="${query}&${extra}"; else query="$extra"; fi; fi
            export BATTLE_BENCHMARK_URL="http://127.0.0.1:8765/grasstex/battle_sim_local.php${query:+?$query}"
            export BATTLE_BENCHMARK_OUTPUT="reports/$arm"
            echo "::group::arm ${arm} (${query:-no flags}), seed ${BATTLE_BENCHMARK_SEED}, windows ${BATTLE_BENCHMARK_WINDOWS}"
            node scripts/run_battle_benchmark.mjs
            echo "::endgroup::"
          done

      - name: Compare the arms
        run: |
          set -uo pipefail
          args=(); for c in $BENCH_COUNTERS; do args+=(--count "$c"); done
          set +e
          node scripts/compare_benchmark_arms.cjs "${args[@]}" reports/off/battle-benchmark.json reports/on/battle-benchmark.json > reports/compare.json
          rc=$?
          set -e
          echo "compare exit ${rc}"
          echo "$rc" > reports/compare.rc
          exit 0

      - name: Process the results
        id: process
        if: always() && hashFiles('reports/compare.json') != ''
        run: |
          set -euo pipefail
          node scripts/process_benchmark_results.cjs --mode single --compare reports/compare.json \
            --off reports/off/battle-benchmark.json --on reports/on/battle-benchmark.json --out result \
            --seed "$BATTLE_BENCHMARK_SEED" --windows "$BATTLE_BENCHMARK_WINDOWS" --type "$BATTLE_TYPE" \
            --query-off "$QUERY_OFF" --query-on "$QUERY_ON"
          cat result/summary.md
          echo "headline=$(head -n 1 result/headline.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish the result to the benchmark-results branch
        id: publish
        if: always() && steps.process.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/publish_benchmark_result.sh result "$GITHUB_RUN_NUMBER"
          echo "viewer=$(head -n 1 result/viewer_url.txt)" >> "$GITHUB_OUTPUT"
          echo "viewer_preview=$(head -n 1 result/viewer_preview_url.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish run summary
        if: always()
        run: |
          {
            if [ -f result/summary.md ]; then
              cat result/summary.md
            else
              echo "## Scripted scenario: \`${BATTLE_BENCHMARK_SEED}\` (no result was produced)"
              echo
              if [ -f reports/compare.json ]; then node scripts/format_benchmark_compare.cjs reports/compare.json || true; fi
            fi
            echo
            echo "Compare exit $(cat reports/compare.rc 2>/dev/null || echo '?') (1 means a runtime error or a median wall-time slowdown above 25%). \`unpaired\` counts windows only one arm reached: a flag that changes how long the battle lasts shows up there."
            if [ -f reports/compare.json ]; then
              echo
              echo "<details><summary>compare.json</summary>"
              echo
              echo '```json'
              cat reports/compare.json
              echo
              echo '```'
              echo "</details>"
            fi
            for arm in off on; do
              if [ -f "reports/$arm/battle-benchmark.md" ]; then
                echo
                echo "<details><summary>${arm} arm report</summary>"
                echo
                cat "reports/$arm/battle-benchmark.md"
                echo
                echo "</details>"
              else
                echo
                echo "**The ${arm} arm produced no report.**"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripted-benchmark-${{ github.run_number }}
          path: |
            reports/
            result/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the run when the comparison failed its gate
        run: |
          rc="$(cat reports/compare.rc 2>/dev/null || echo 2)"
          if [ "$rc" != 0 ]; then echo "compare_benchmark_arms.cjs exited ${rc}" >&2; exit 1; fi

      - name: Show server log on failure
        if: failure()
        run: tail -n 300 /tmp/battle-php.log || true

  # ---- several seeds: a paired run across shards ------------------------------------------------------------------------------
  plan:
    name: Plan the shards
    if: ${{ (github.event.inputs.seeds || '1') != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - name: Checkout the planner
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/plan_benchmark_shards.cjs
          sparse-checkout-cone-mode: false
      - name: Plan
        id: plan
        env:
          SEEDS: ${{ github.event.inputs.seeds }}
          WINDOWS: ${{ github.event.inputs.windows }}
        run: |
          set -euo pipefail
          shards="$(node scripts/plan_benchmark_shards.cjs "$SEEDS" 20)"
          echo "matrix={\"include\":${shards}}" >> "$GITHUB_OUTPUT"
          echo "windows=${WINDOWS:-contact+120}" >> "$GITHUB_OUTPUT"
          echo "${SEEDS} seeds over: ${shards}"

  shards:
    name: Shard ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BATTLE_BENCHMARK_SOURCE_SHA: ${{ github.sha }}
      BATTLE_BENCHMARK_COUNT: ${{ matrix.count }}
      BATTLE_BENCHMARK_FIRST: ${{ matrix.first }}
      BATTLE_BENCHMARK_TIME_LIMIT: '600'
      BATTLE_BENCHMARK_STEP: '0.15'
      BATTLE_BENCHMARK_WINDOWS: ${{ needs.plan.outputs.windows }}
      BATTLE_BENCHMARK_SEED: ${{ github.event.inputs.seed || 'scripted-seeds' }}
      BATTLE_TYPE: ${{ github.event.inputs.battle_type || 'meeting' }}
      QUERY_OFF: ${{ github.event.inputs.query_off || '' }}
      QUERY_ON: ${{ github.event.inputs.query_on || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local battle server
        run: |
          rm -rf /tmp/battle-www
          mkdir -p /tmp/battle-www
          ln -s "$GITHUB_WORKSPACE" /tmp/battle-www/grasstex
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8765 -t /tmp/battle-www >/tmp/battle-php.log 2>&1 &
          echo $! > /tmp/battle-php.pid
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=healthcheck" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/battle-php.log
          exit 1

      - name: Run both arms on this shard's seeds
        run: |
          set -euo pipefail
          case "$BATTLE_TYPE" in
            meeting) defender_query='' ;;
            us-defend) defender_query='defender=us' ;;
            ge-defend) defender_query='defender=ge' ;;
            *) echo "Unknown battle type: $BATTLE_TYPE" >&2; exit 2 ;;
          esac
          for arm in off on; do
            if [ "$arm" = off ]; then extra="$QUERY_OFF"; else extra="$QUERY_ON"; fi
            extra="${extra#[?&]}"
            query="$defender_query"
            if [ -n "$extra" ]; then if [ -n "$query" ]; then query="${query}&${extra}"; else query="$extra"; fi; fi
            export BATTLE_BENCHMARK_URL="http://127.0.0.1:8765/grasstex/battle_sim_local.php${query:+?$query}"
            export BATTLE_BENCHMARK_OUTPUT="reports/$arm"
            echo "::group::shard ${{ matrix.shard }}, arm ${arm} (${query:-no flags}), seeds ${BATTLE_BENCHMARK_SEED}-NNNN from index ${BATTLE_BENCHMARK_FIRST} x ${BATTLE_BENCHMARK_COUNT}, windows ${BATTLE_BENCHMARK_WINDOWS}"
            node scripts/run_battle_benchmark.mjs
            echo "::endgroup::"
          done

      - name: Upload shard reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeds-${{ github.run_number }}-shard-${{ matrix.shard }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Show server log on failure
        if: failure()
        run: tail -n 300 /tmp/battle-php.log || true

  compare:
    name: Pool the shards and compare
    needs: [plan, shards]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      headline: ${{ steps.process.outputs.headline }}
      viewer: ${{ steps.publish.outputs.viewer }}
      viewer_preview: ${{ steps.publish.outputs.viewer_preview }}
    env:
      SEED_PREFIX: ${{ github.event.inputs.seed || 'scripted-seeds' }}
      SEEDS: ${{ github.event.inputs.seeds }}
      WINDOWS: ${{ needs.plan.outputs.windows }}
      BATTLE_TYPE: ${{ github.event.inputs.battle_type || 'meeting' }}
      QUERY_OFF: ${{ github.event.inputs.query_off || '' }}
      QUERY_ON: ${{ github.event.inputs.query_on || '' }}
      SHARDS_RESULT: ${{ needs.shards.result }}
    steps:
      - name: Checkout the compare tools
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/compare_benchmark_arms.cjs
            scripts/format_benchmark_compare.cjs
            scripts/process_benchmark_results.cjs
            scripts/publish_benchmark_result.sh
          sparse-checkout-cone-mode: false

      - name: Download the shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: seeds-${{ github.run_number }}-shard-*
          path: shard-reports

      - name: Compare the arms, paired by seed
        run: |
          set -uo pipefail
          mkdir -p reports
          off="$(find shard-reports -path '*/off/battle-benchmark.json' | sort | paste -sd, -)"
          on="$(find shard-reports -path '*/on/battle-benchmark.json' | sort | paste -sd, -)"
          echo "off reports: $(echo "$off" | tr ',' '\n' | grep -c . || true), on reports: $(echo "$on" | tr ',' '\n' | grep -c . || true)"
          if [ -z "$off" ] || [ -z "$on" ]; then echo 'No shard produced both arms.' >&2; echo 2 > reports/compare.rc; exit 0; fi
          args=(); for c in $BENCH_COUNTERS; do args+=(--count "$c"); done
          set +e
          node scripts/compare_benchmark_arms.cjs "${args[@]}" "$off" "$on" > reports/compare.json
          rc=$?
          set -e
          echo "compare exit ${rc}"
          echo "$rc" > reports/compare.rc
          exit 0

      - name: Process the results
        id: process
        if: always() && hashFiles('reports/compare.json') != ''
        run: |
          set -euo pipefail
          off="$(find shard-reports -path '*/off/battle-benchmark.json' | sort | paste -sd, -)"
          on="$(find shard-reports -path '*/on/battle-benchmark.json' | sort | paste -sd, -)"
          node scripts/process_benchmark_results.cjs --mode seeds --compare reports/compare.json --off "$off" --on "$on" --out result \
            --seed "$SEED_PREFIX" --seeds "$SEEDS" --windows "$WINDOWS" --type "$BATTLE_TYPE" \
            --query-off "$QUERY_OFF" --query-on "$QUERY_ON"
          cat result/summary.md
          echo "headline=$(head -n 1 result/headline.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish the result to the benchmark-results branch
        id: publish
        if: always() && steps.process.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/publish_benchmark_result.sh result "$GITHUB_RUN_NUMBER"
          echo "viewer=$(head -n 1 result/viewer_url.txt)" >> "$GITHUB_OUTPUT"
          echo "viewer_preview=$(head -n 1 result/viewer_preview_url.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish run summary
        if: always()
        run: |
          {
            if [ -f result/summary.md ]; then
              cat result/summary.md
            else
              echo "## Seeds \`${SEED_PREFIX}\` (no result was produced)"
              echo
              echo '**No comparison was produced.**'
            fi
            echo
            echo "- shard jobs: ${SHARDS_RESULT}; compare exit $(cat reports/compare.rc 2>/dev/null || echo '?') (1 means a runtime error or a median wall-time slowdown above 25%). \`unpaired\` counts seeds only one arm completed; the arms ran one after the other on each shard's runner."
            if [ -f reports/compare.json ]; then
              echo
              echo "<details><summary>compare.json</summary>"
              echo
              echo '```json'
              cat reports/compare.json
              echo
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeds-${{ github.run_number }}-compare
          path: |
            reports/
            result/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the run when a shard or the comparison failed
        run: |
          rc="$(cat reports/compare.rc 2>/dev/null || echo 2)"
          if [ "$rc" != 0 ]; then echo "compare_benchmark_arms.cjs exited ${rc}" >&2; exit 1; fi
          if [ "$SHARDS_RESULT" != success ]; then echo "shard jobs: ${SHARDS_RESULT}; the comparison above uses the seeds that completed" >&2; exit 1; fi

  notify:
    name: Notify benchmark result
    needs: [single, plan, shards, compare]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send ntfy notification
        env:
          RESULTS: ${{ needs.single.result }} ${{ needs.plan.result }} ${{ needs.shards.result }} ${{ needs.compare.result }}
          HEADLINE: ${{ needs.single.outputs.headline || needs.compare.outputs.headline }}
          VIEWER: ${{ needs.single.outputs.viewer || needs.compare.outputs.viewer }}
          VIEWER_PREVIEW: ${{ needs.single.outputs.viewer_preview || needs.compare.outputs.viewer_preview }}
          SEED: ${{ github.event.inputs.seed }}
          SEEDS: ${{ github.event.inputs.seeds || '1' }}
          QUERY_OFF: ${{ github.event.inputs.query_off || '' }}
          QUERY_ON: ${{ github.event.inputs.query_on || '' }}
          SOURCE_REF: ${{ github.ref_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if echo "$RESULTS" | grep -Eq 'failure|cancelled'; then status="FAILED (${RESULTS})"; tags='x,warning'; priority='high'; else status='COMPLETE'; tags='white_check_mark,crossed_swords'; priority='default'; fi
          if [ "$SEEDS" = 1 ]; then what="${SEED:-scripted-scout-0003}"; else what="${SEEDS} seeds"; fi
          # The click opens the map on the server with both arms loaded, once the server's viewer has the loading code (it gets it when this
          # reaches main); until then the viewer of the branch that ran, if it is up; else the run.
          # (the page is read into a variable first: `curl | grep -q` under pipefail fails when grep stops reading early)
          supports() { local body; body="$(curl -fsS -m 20 "${1%%\?*}" 2>/dev/null || true)"; [[ "$body" == *autoLoadRuntimeFromQuery* ]]; }
          click="$RUN_URL"
          if [ -n "$VIEWER" ] && supports "$VIEWER"; then click="$VIEWER"
          elif [ -n "$VIEWER_PREVIEW" ] && supports "$VIEWER_PREVIEW"; then click="$VIEWER_PREVIEW"
          fi
          echo "click: $click"
          curl -fsS \
            -H "Title: M3C benchmark #${GITHUB_RUN_NUMBER}" \
            -H "Priority: ${priority}" \
            -H "Tags: ${tags}" \
            -H "Click: ${click}" \
            -H "Actions: view, Open run, ${RUN_URL}" \
            -d "${status} · ${what} · ${HEADLINE:-no result produced} · off [${QUERY_OFF:-none}] vs on [${QUERY_ON:-none}] · ${SOURCE_REF}" \
            https://ntfy.sh/ww2battlesim

      - name: Send Slack benchmark notification
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_BENCHMARK_WEBHOOK_URL }}
          RESULTS: ${{ needs.single.result }} ${{ needs.plan.result }} ${{ needs.shards.result }} ${{ needs.compare.result }}
          HEADLINE: ${{ needs.single.outputs.headline || needs.compare.outputs.headline }}
          VIEWER: ${{ needs.single.outputs.viewer || needs.compare.outputs.viewer }}
          VIEWER_PREVIEW: ${{ needs.single.outputs.viewer_preview || needs.compare.outputs.viewer_preview }}
          SEED: ${{ github.event.inputs.seed || 'scripted-scout-0003' }}
          SEEDS: ${{ github.event.inputs.seeds || '1' }}
          QUERY_OFF: ${{ github.event.inputs.query_off || '' }}
          QUERY_ON: ${{ github.event.inputs.query_on || '' }}
          SOURCE_REF: ${{ github.ref_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ORIGIN_AGENT: ${{ github.event.inputs.origin_agent || 'human' }}
          CORRELATION_ID: ${{ github.event.inputs.correlation_id || '' }}
          PURPOSE: ${{ github.event.inputs.purpose || '' }}
        run: |
          set -euo pipefail

          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack webhook is not configured; skipping."
            exit 0
          fi

          status="COMPLETE"
          emoji=":white_check_mark:"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled'; then
            status="FAILED"
            emoji=":x:"
          fi

          result_url="$RUN_URL"
          if [ -n "$VIEWER" ]; then
            result_url="$VIEWER"
          elif [ -n "$VIEWER_PREVIEW" ]; then
            result_url="$VIEWER_PREVIEW"
          fi

          jq -n \
            --arg emoji "$emoji" \
            --arg status "$status" \
            --arg run "$GITHUB_RUN_NUMBER" \
            --arg ref "$SOURCE_REF" \
            --arg agent "$ORIGIN_AGENT" \
            --arg correlation "$CORRELATION_ID" \
            --arg purpose "$PURPOSE" \
            --arg seed "$SEED" \
            --arg seeds "$SEEDS" \
            --arg off "$QUERY_OFF" \
            --arg on "$QUERY_ON" \
            --arg headline "${HEADLINE:-no result produced}" \
            --arg result_url "$result_url" \
            --arg run_url "$RUN_URL" \
            '{text: ($emoji + " *Grasstex benchmark " + $status + "* — #" + $run
              + "\n*Source:* " + $ref
              + "\n*Requested by:* " + $agent
              + (if $correlation == "" then "" else "\n*Correlation:* " + $correlation end)
              + (if $purpose == "" then "" else "\n*Purpose:* " + $purpose end)
              + "\n*Run:* " + $seeds + " seed(s), " + $seed
              + "\n*OFF:* " + (if $off == "" then "none" else $off end)
              + "\n*ON:* " + (if $on == "" then "none" else $on end)
              + "\n*Result:* " + $headline
              + "\n<" + $result_url + "|Open result> · <" + $run_url + "|GitHub run>")}' \
            | curl --fail-with-body --silent --show-error --retry 3 \
                -H 'Content-Type: application/json' \
                --data-binary @- \
                "$SLACK_WEBHOOK_URL"
