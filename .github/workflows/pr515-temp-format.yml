name: PR515 temporary Prettier export
on:
  pull_request:
    branches: [main]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prettier 3.3.3 changed files
        run: npx --yes prettier@3.3.3 --write battle/modules/15n-squad-leader-local-plan.js battle/modules/15l-squad-leader-mission-execution.js tools/ai-sim-harness/local-mission-tasks-check.js
      - name: Export exact formatted files
        run: |
          echo 'PR515_0_BEGIN'
          base64 -w0 battle/modules/15n-squad-leader-local-plan.js
          echo
          echo 'PR515_0_END'
          echo 'PR515_1_BEGIN'
          base64 -w0 battle/modules/15l-squad-leader-mission-execution.js
          echo
          echo 'PR515_1_END'
          echo 'PR515_2_BEGIN'
          base64 -w0 tools/ai-sim-harness/local-mission-tasks-check.js
          echo
          echo 'PR515_2_END'
