name: Temporary player-ray hit formatting
on:
  push:
    branches:
      - work/issue418-player-shot-format
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Prettier to exact touched files
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write battle/squad-ai.js tools/ai-sim-harness/player-control-check.js
          git config user.name 'grasstex-ci[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add battle/squad-ai.js tools/ai-sim-harness/player-control-check.js
          if ! git diff --cached --quiet; then
            git commit -m "Format player fire-origin parity and test with pinned Prettier"
            git push origin HEAD:refs/heads/work/issue418-player-shot-format
          fi
