name: Temporary tactical map formatting
on:
  push:
    branches:
      - feat/reported-contact-tactical-map
    paths:
      - .github/workflows/temporary-tactical-map-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reported-contact-tactical-map
      - name: Format scoped changed files
        run: |
          npx --yes prettier@3.3.3 --write battle/modules/55-reported-contact-tactical-map.js battle/camera-controls.js tools/ai-sim-harness/tactical-map-check.js tools/ai-sim-harness/camera-input-frame-check.js
          if ! git diff --quiet -- battle/modules/55-reported-contact-tactical-map.js battle/camera-controls.js tools/ai-sim-harness/tactical-map-check.js tools/ai-sim-harness/camera-input-frame-check.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add battle/modules/55-reported-contact-tactical-map.js battle/camera-controls.js tools/ai-sim-harness/tactical-map-check.js tools/ai-sim-harness/camera-input-frame-check.js
            git commit -m "style(ui): format tactical map and camera input changes"
            git push origin HEAD:feat/reported-contact-tactical-map
          fi
