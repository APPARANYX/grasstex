name: PR519 final format export
on:
  pull_request:
    branches: [main]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format changed source
        run: npx --yes prettier@3.3.3 --write battle/modules/15o-squad-leader-tactical-postures.js tools/ai-sim-harness/tactical-postures-check.js
      - name: Export exact formatter output
        run: |
          echo 'PR519C_0_BEGIN'
          base64 -w0 battle/modules/15o-squad-leader-tactical-postures.js
          echo
          echo 'PR519C_0_END'
          echo 'PR519C_1_BEGIN'
          base64 -w0 tools/ai-sim-harness/tactical-postures-check.js
          echo
          echo 'PR519C_1_END'
