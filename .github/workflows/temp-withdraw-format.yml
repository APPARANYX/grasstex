name: Temporary withdraw formatter
on:
  push:
    branches:
      - work/audit-local-break-contact
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes prettier@3.3.3 --write battle/engagement.js tools/ai-sim-harness/local-withdraw-check.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "grasstex-format-bot"
          git config user.email "grasstex-format-bot@users.noreply.github.com"
          git add battle/engagement.js tools/ai-sim-harness/local-withdraw-check.js
          git commit -m "Format local withdrawal fix"
          git push
