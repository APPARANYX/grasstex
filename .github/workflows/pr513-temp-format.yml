name: PR513 temporary formatting export
on:
  pull_request:
    branches: [main]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format changed files
        run: npx --yes prettier@3.3.3 --write battle/modules/15n-squad-leader-local-plan.js tools/ai-sim-harness/local-mission-tasks-check.js
      - name: Export source
        run: |
          echo 'PR513_SOURCE_BEGIN'
          base64 -w0 battle/modules/15n-squad-leader-local-plan.js
          echo
          echo 'PR513_SOURCE_END'
          echo 'PR513_TEST_BEGIN'
          base64 -w0 tools/ai-sim-harness/local-mission-tasks-check.js
          echo
          echo 'PR513_TEST_END'
