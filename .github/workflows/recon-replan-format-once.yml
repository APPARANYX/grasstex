name: One-Shot Ambush Replan Format
on:
  push:
    branches:
      - work/recon-ambush-causality-20261015
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format only changed replan code and regression
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write battle/modules/15o-squad-leader-tactical-postures.js tools/ai-sim-harness/phase-c-preparation-check.js
          git diff --check
          if git diff --quiet -- battle/modules/15o-squad-leader-tactical-postures.js tools/ai-sim-harness/phase-c-preparation-check.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add battle/modules/15o-squad-leader-tactical-postures.js tools/ai-sim-harness/phase-c-preparation-check.js
          git commit -m 'style: format replan safety implementation and regression'
          git push origin HEAD:refs/heads/work/recon-ambush-causality-20261015
