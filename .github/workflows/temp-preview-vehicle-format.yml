name: TEMP Format Ref Preview Vehicle Test
on:
  push:
    branches: [work/fix-ref-preview-vehicle-assets-20261017]
    paths: [.github/workflows/temp-preview-vehicle-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Format test and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write tools/ai-sim-harness/ref-preview-vehicle-staging-check.js
          git rm .github/workflows/temp-preview-vehicle-format.yml
          git add -- tools/ai-sim-harness/ref-preview-vehicle-staging-check.js
          git config user.name grasstex-ci
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(preview): format vehicle staging check and self-clean"
          git push origin HEAD:work/fix-ref-preview-vehicle-assets-20261017
