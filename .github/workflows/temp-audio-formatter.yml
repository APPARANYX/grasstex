name: Temporary audio PR formatter
on:
  push:
    branches:
      - work/lightweight-listener-acoustics
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print formatted JS for handoff
        run: |
          npx --yes prettier@3.3.3 --write battle/battle-sim.js battle/modules/09-voice-runtime.js battle/modules/11-voice-variation.js battle/modules/12a-listener-acoustics.js battle/modules/15-combat-audio.js battle/modules/15-weapon-foley-audio.js tools/ai-sim-harness/listener-acoustics-check.js >/dev/null
          for f in battle/battle-sim.js battle/modules/09-voice-runtime.js battle/modules/11-voice-variation.js battle/modules/12a-listener-acoustics.js battle/modules/15-combat-audio.js battle/modules/15-weapon-foley-audio.js tools/ai-sim-harness/listener-acoustics-check.js; do
            echo "GT_FORMAT_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "GT_FORMAT_END:$f"
          done
