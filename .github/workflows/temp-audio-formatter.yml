name: Temporary regression formatter
on:
  push:
    branches: [work/lightweight-listener-acoustics]
    paths: [.github/workflows/temp-audio-formatter.yml]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide formatted JS for precision-safe tests
        run: |
          npx --yes prettier@3.3.3 --write tools/ai-sim-harness/harness.js tools/ai-sim-harness/personal-space-check.js tools/ai-sim-harness/mg-station-setup-check.js tools/ai-sim-harness/window-port-check.js tools/ai-sim-harness/tactical-positions-check.js tools/ai-sim-harness/local-steering-check.js tools/ai-sim-harness/weapon-shot-buffer-check.js tools/ai-sim-harness/objective-nav-check.js tools/ai-sim-harness/player-control-check.js >/dev/null
          for f in tools/ai-sim-harness/harness.js tools/ai-sim-harness/personal-space-check.js tools/ai-sim-harness/mg-station-setup-check.js tools/ai-sim-harness/window-port-check.js tools/ai-sim-harness/tactical-positions-check.js tools/ai-sim-harness/local-steering-check.js tools/ai-sim-harness/weapon-shot-buffer-check.js tools/ai-sim-harness/objective-nav-check.js tools/ai-sim-harness/player-control-check.js; do
            echo "GT_FORMAT_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "GT_FORMAT_END:$f"
          done
