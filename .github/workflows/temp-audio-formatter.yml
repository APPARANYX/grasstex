name: Temporary audio source format
on:
  push:
    branches:
      - work/lightweight-listener-acoustics
    paths:
      - .github/workflows/temp-audio-formatter.yml
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print verified Prettier output
        run: |
          npx --yes prettier@3.3.3 --write battle/battle-sim.js battle/modules/12a-listener-acoustics.js battle/modules/11-voice-variation.js battle/modules/09-voice-runtime.js >/dev/null
          for f in battle/battle-sim.js battle/modules/12a-listener-acoustics.js battle/modules/11-voice-variation.js battle/modules/09-voice-runtime.js; do
            echo "GT_FORMAT_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "GT_FORMAT_END:$f"
          done
