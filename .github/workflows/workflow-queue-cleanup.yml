name: One-time superseded #671 Actions queue cleanup
on:
  push:
    branches:
      - work/actions-queue-hygiene-20261026
    paths:
      - .github/workflows/workflow-queue-cleanup.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel only superseded PR #671 branch runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ["REPO"]
          branch = "work/tactical-contact-route-graph-20261026"
          auth = {
            "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          }
          def get(url):
            req = urllib.request.Request(url, headers=auth)
            with urllib.request.urlopen(req, timeout=25) as res:
              return json.load(res)
          latest = get(f"https://api.github.com/repos/{repo}/branches/{branch}")["commit"]["sha"]
          print("Keeping live head:", branch, latest, flush=True)
          found = {}
          for state in ("queued", "in_progress", "waiting", "pending"):
            for page in range(1, 6):
              q = urllib.parse.urlencode({"branch": branch, "status": state, "per_page": 100, "page": page})
              payload = get(f"https://api.github.com/repos/{repo}/actions/runs?{q}")
              runs = payload.get("workflow_runs", [])
              for run in runs:
                if run.get("head_branch") != branch or run.get("head_sha") == latest:
                  continue
                if run.get("status") not in ("queued", "in_progress", "waiting", "pending", "requested"):
                  continue
                # Never cancel main, benchmark-results, unrelated PRs, or latest #671 SHA.
                found[run["id"]] = (run.get("name"), run.get("head_sha"), run.get("status"))
              if len(runs) < 100:
                break
          print("Superseded active runs:", len(found), flush=True)
          success = 0
          denied = 0
          for run_id, (name, sha, status) in found.items():
            req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel",
              headers=auth, method="POST", data=b""
            )
            try:
              with urllib.request.urlopen(req, timeout=25) as res:
                ok = res.status == 202
                success += int(ok)
                print("cancel", res.status, run_id, status, str(sha)[:8], name, flush=True)
            except urllib.error.HTTPError as exc:
              if exc.code in (404, 409, 422):
                print("already finished", exc.code, run_id, flush=True)
              else:
                denied += 1
                print("ERROR", exc.code, run_id, exc.read()[:400], flush=True)
          print("Cancel accepted:", success, "unexpected errors:", denied, flush=True)
          if denied:
            raise SystemExit(1)
          PY
