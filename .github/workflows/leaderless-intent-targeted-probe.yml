name: Leaderless Intent Targeted Probe

# Temporary branch-only evidence: exercise non-retreat leaderless hold/fight episodes on known benchmark seeds.
on:
  push:
    branches:
      - 'work/leaderless-intent-continuation'
    paths:
      - '.github/workflows/leaderless-intent-targeted-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Non-retreat leaderless freeze probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local battle server
        run: |
          set -euo pipefail
          rm -rf /tmp/battle-www
          mkdir -p /tmp/battle-www
          ln -s "$GITHUB_WORKSPACE" /tmp/battle-www/grasstex
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8765 -t /tmp/battle-www >/tmp/battle-php.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=healthcheck" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/battle-php.log
          exit 1

      - name: Probe known non-retreat leader-loss episodes
        env:
          PROBE: leaderless-intent
          PROBE_CONTROL: '1'
          PROBE_SECONDS: '600'
          PROBE_BATTLES: ge-defend:leaderless-intent-ge-defend-0012,meeting:leaderless-intent-meeting-0008
          PROBE_URL: http://127.0.0.1:8765/grasstex/battle_sim_local.php?leaderlessIntent=1
          PROBE_OUTPUT: reports/leaderless-intent-targeted.json
        run: |
          set -euo pipefail
          mkdir -p reports
          node scripts/run_probe.cjs | tee reports/leaderless-intent-targeted.log
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('reports/leaderless-intent-targeted.json','utf8'));
          let active=0, nonRetreat=0;
          for (const b of d.battles) {
            if (b.sameBattle !== true) throw new Error('probe changed battle for '+b.type+':'+b.seed);
            const r=b.reports && b.reports['leaderless-intent'];
            if (!r) throw new Error('missing report');
            active += r.activeSquadSamples || 0;
            nonRetreat += (r.activeSquadSamples || 0) - (r.retreatSamples || 0);
            for (const k of [
              'routeIndexViolations','phaseViolations','orderVersionViolations',
              'objectiveViolations','anchorViolations','fireteamDestinationViolations',
              'newMesoLeaseViolations'
            ]) if ((r[k] || 0) !== 0) throw new Error(k+'='+r[k]+' in '+b.type+':'+b.seed);
            for (const k of ['anchorDriftMax','objectiveDriftMax','fireteamDriftMax'])
              if ((r[k] || 0) > 0.05) throw new Error(k+'='+r[k]+' in '+b.type+':'+b.seed);
          }
          if (!active) throw new Error('targeted seeds produced no leaderless samples');
          if (!nonRetreat) throw new Error('targeted seeds produced no non-retreat leaderless samples');
          console.log('Targeted leaderless freeze invariants clean; non-retreat samples='+nonRetreat);
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaderless-intent-targeted-probe
          path: reports/
          retention-days: 30

      - name: Show server log on failure
        if: failure()
        run: tail -n 300 /tmp/battle-php.log || true
