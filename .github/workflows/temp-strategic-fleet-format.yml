name: TEMP strategic fleet formatter (self-removing)
on:
  push:
    branches:
      - work/strategic-depot-fleet-20261016
    paths:
      - .github/workflows/temp-strategic-fleet-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply repository Prettier and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write \
            battle/modules/58-strategic-abstract-transport.js \
            battle/modules/59-strategic-truck-visual.js \
            tools/ai-sim-harness/strategic-transport-check.js \
            scripts/probe_strategic_truck_visual.cjs
          git rm -- .github/workflows/temp-strategic-fleet-format.yml
          git add -- battle/modules/58-strategic-abstract-transport.js \
            battle/modules/59-strategic-truck-visual.js \
            tools/ai-sim-harness/strategic-transport-check.js \
            scripts/probe_strategic_truck_visual.cjs
          git config user.name "grasstex-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(strategic): format persistent depot fleet and remove temporary formatter"
          git push origin HEAD:work/strategic-depot-fleet-20261016
