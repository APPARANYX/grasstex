name: One-shot live seed format
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
  pull-requests: read
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/legacy-auto-seed-refresh-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Apply pinned format and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write \
            battle/scenario-generator.js \
            tools/ai-sim-harness/initial-seed-url-check.js \
            tools/ai-sim-harness/world-placement-check.js
          rm .github/workflows/one-shot-live-seed-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- battle/scenario-generator.js \
            tools/ai-sim-harness/initial-seed-url-check.js \
            tools/ai-sim-harness/world-placement-check.js \
            .github/workflows/one-shot-live-seed-format.yml
          git commit -m "Format live seed URL handling and regression"
          git push origin HEAD:${{ github.head_ref }}
