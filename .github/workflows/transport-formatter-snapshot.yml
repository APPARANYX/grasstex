name: Transport Formatter Snapshot
on:
  push:
    branches:
      - work/strategic-motorized-transport-core-20261015
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format transport source and regression
        run: |
          npx --yes prettier@3.3.3 --write battle/strategic-transport-core.js tools/ai-sim-harness/strategic-transport-core-check.js
          mkdir -p formatted/battle formatted/tools/ai-sim-harness
          cp battle/strategic-transport-core.js formatted/battle/
          cp tools/ai-sim-harness/strategic-transport-core-check.js formatted/tools/ai-sim-harness/
      - uses: actions/upload-artifact@v4
        with:
          name: transport-prettier-snapshot
          path: formatted/
          retention-days: 1
