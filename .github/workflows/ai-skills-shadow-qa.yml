name: AI Skills shadow browser QA
on:
  pull_request:
    paths:
      - 'battle/modules/60*-ai-skill*.js'
      - runtime-contract.php
      - scripts/probes/probe_ai_skills_shadow.cjs
      - scripts/probes/probe_ai_skills_squad.cjs
      - .github/workflows/ai-skills-shadow-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-skills-shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium harness
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Immutable preview lifecycle and read neutrality
        env:
          AI_SKILLS_PILOT: '1'
          AI_SKILLS_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          AI_SKILLS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/probes/probe_ai_skills_shadow.cjs
      - name: Immutable squad natural replay and lifecycle
        env:
          AI_SKILLS_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          AI_SKILLS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/probes/probe_ai_skills_squad.cjs
      - name: Preserve browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-skills-shadow-browser
          path: |
            reports/ai-skills-shadow/
            reports/ai-skills-pilot/
            reports/ai-skills-squad/
          retention-days: 30
