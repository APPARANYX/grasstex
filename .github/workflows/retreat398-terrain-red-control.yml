name: PR398 terrain-arrival negative control
on:
  push:
    branches:
      - work/retreat398-terrain-red-control
permissions:
  contents: read
jobs:
  red-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing code must fail new physical arrival assertion
        run: node tools/ai-sim-harness/retreat-anchor-check.js
