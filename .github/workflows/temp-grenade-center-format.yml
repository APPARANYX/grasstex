name: Temporary grenade fog formatting
on:
  push:
    branches:
      - work/grenade-fog-center-at-grenade
    paths:
      - .github/workflows/temp-grenade-center-format.yml
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Show exact Prettier correction
        run: |
          npx --yes prettier@3.3.3 --write battle/modules/24-grenade-fx.js >/dev/null
          git --no-pager diff -- battle/modules/24-grenade-fx.js
