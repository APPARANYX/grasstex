name: ⭐ Generate combat sound effects

# Generates the clips Assets/audio/combat-sfx-manifest.json declares (near-miss flybys, ricochets, surface
# impacts, flesh hits, pain) that do not exist yet, with ElevenLabs Sound Effects (scripts/generate_combat_sfx.py:
# one generation per variation), onset-checks the one-event clips (scripts/check_weapon_clips.py --shots, reported,
# not blocking), masters them (scripts/normalize_audio.sh, the combat/* targets), clears their lines from
# Assets/audio/.manifest-placeholders.txt and commits them to the branch that ran. It only ever adds missing files:
# a clip that already exists is never regenerated, so a rerun spends nothing. Generating spends ElevenLabs credits.
#
# Runs only when started by hand (Actions > Run workflow), never on a push: ElevenLabs is called only on a
# person's say-so. It needs
# the repository secret ELEVEN_LABS_API (ELEVENLABS_API_KEY also works); without it the run says so and stops
# without failing. It never runs on main (main deploys to production on every push).
#
# Its commit is pushed with the workflow token, and GitHub starts no workflow for such a push, so CI does not run on
# it: push the next commit yourself (or update the pull request) before merging.

on:
  workflow_dispatch:
    inputs:
      max_new:
        description: "Most missing clips one run may generate (default 12; 0 = no cap). Raise only for an intended bulk run."
        required: false
        default: ""
        type: string
      only:
        description: "Groups or group.clip ids (space separated); blank for every missing clip"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: combat-sfx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Check the API key
        id: key
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVEN_LABS_API || secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "Repository secret ELEVEN_LABS_API is not set: nothing generated." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ffmpeg
        if: steps.key.outputs.ok == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Every clip must be present before generating, or the generator sees the library as missing and
      # regenerates it (it once re-ran all 58 combat clips); and before mastering: normalize_audio.sh drops the .mastering-state.tsv
      # line of every file it cannot find, and check_audio_manifest.py needs them. Overlaid from the
      # private APPARANYX/grasstex-audio (gitignored, so `git add` never commits them).
      - name: Pinned private audio commit
        id: private-audio
        if: steps.key.outputs.ok == 'true'
        run: echo "commit=$(python3 -c 'import json;print(json.load(open("Assets/audio/private-audio.lock.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the private audio
        if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: APPARANYX/grasstex-audio
          ref: ${{ steps.private-audio.outputs.commit }}
          ssh-key: ${{ secrets.PRIVATE_AUDIO_READ_KEY || secrets.AUDIO_PRIVATE_WRITE_KEY }}
          path: .runtime/private-audio
          persist-credentials: false

      - name: Overlay the private audio
        if: steps.key.outputs.ok == 'true'
        run: bash scripts/fetch_private_audio.sh .runtime/private-audio

      # A failed generation must not throw away the clips already paid for: the step records the failure
      # and carries on, so the clips that did come back are mastered, published and committed (a rerun then
      # generates only what is still missing), and the last step fails the run.
      - name: Generate the missing clips
        id: generate
        if: steps.key.outputs.ok == 'true'
        env:
          GENERATE_MAX_NEW: ${{ inputs.max_new }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVEN_LABS_API || secrets.ELEVENLABS_API_KEY }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          status=0
          if [ -n "${ONLY:-}" ]; then
            # shellcheck disable=SC2086
            python3 scripts/generate_combat_sfx.py --only $ONLY 2>&1 | tee "$RUNNER_TEMP/generate.log" || status=$?
          else
            python3 scripts/generate_combat_sfx.py 2>&1 | tee "$RUNNER_TEMP/generate.log" || status=$?
          fi
          tail -n 2 "$RUNNER_TEMP/generate.log" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] && [ -z "$(find .runtime/combat-sfx -name '*.mp3' 2>/dev/null | head -1)" ]; then
            echo "Generation failed and produced no clip." | tee -a "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Onset check (one event per clip)
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          files=$(find .runtime/combat-sfx -name '*.mp3' -not -path '*/pain/*' | sort)
          [ -z "$files" ] && exit 0
          python3 -m pip install -q numpy
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2086
          python3 scripts/check_weapon_clips.py --shots $files 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Copy, master and check
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          (cd .runtime/combat-sfx 2>/dev/null && find . -name '*.mp3' | sed 's|^\./||' | sort) > "$RUNNER_TEMP/new.txt" || true
          while read -r rel; do
            [ -n "$rel" ] || continue
            mkdir -p "$(dirname "Assets/audio/$rel")"
            # Trim the generator's leading silence, so a near miss sounds when the round passes, not after it.
            ffmpeg -nostdin -loglevel error -y -i ".runtime/combat-sfx/$rel" \
              -af 'silenceremove=start_periods=1:start_threshold=-45dB:start_silence=0.004' \
              -ac 1 -ar 48000 -b:a 128k "Assets/audio/$rel"
            grep -vxF "$rel" Assets/audio/.manifest-placeholders.txt > "$RUNNER_TEMP/ph.txt" || true
            cp "$RUNNER_TEMP/ph.txt" Assets/audio/.manifest-placeholders.txt
          done < "$RUNNER_TEMP/new.txt"
          bash scripts/normalize_audio.sh Assets/audio
          python3 scripts/check_audio_manifest.py

      # New clips go to the private APPARANYX/grasstex-audio (never this public repo): push them there with
      # the write deploy key and pin the new commit in Assets/audio/private-audio.lock.json, which the next
      # step commits here with the mastering state.
      - name: Check out the private audio for publishing
        if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: APPARANYX/grasstex-audio
          ref: main
          ssh-key: ${{ secrets.AUDIO_PRIVATE_WRITE_KEY }}
          path: .runtime/private-audio-publish

      - name: Publish new clips to the private audio
        id: publish
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          bash scripts/publish_private_audio.sh .runtime/private-audio-publish | tee "$RUNNER_TEMP/publish.log"
          echo "count=$(sed -n 's/^published=//p' "$RUNNER_TEMP/publish.log")" >> "$GITHUB_OUTPUT"

      - name: Commit the new clips
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          git add Assets/audio
          if git diff --cached --quiet; then
            echo "No new clips: every declared clip already exists." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          n="${{ steps.publish.outputs.count }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git commit -m "Audio: generate $n combat sound effects (ElevenLabs, mastered)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Committed $n new clips to ${GITHUB_REF_NAME}." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail if any generation failed
        if: steps.key.outputs.ok == 'true' && steps.generate.outputs.status != '0'
        run: |
          echo "Some clips failed to generate (see the generate step); the ones that succeeded were kept and committed. A rerun generates only what is missing." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
