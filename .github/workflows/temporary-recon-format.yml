name: Temporary recon formatter diff
on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Print exact module formatter patch
        run: |
          npx --yes prettier@3.3.3 --write battle/modules/59-strategic-aerial-recon.js
          echo RECON_FORMAT_DIFF_BEGIN
          git diff -- battle/modules/59-strategic-aerial-recon.js
          echo RECON_FORMAT_DIFF_END
