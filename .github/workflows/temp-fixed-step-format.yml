name: Temporary formatter inspection
on:
  pull_request:
    paths:
      - '.github/workflows/temp-fixed-step-format.yml'
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show formatter diff
        run: |
          npx --yes prettier@3.3.3 --write tools/ai-sim-harness/fixed-step-clock-check.js
          git --no-pager diff -- tools/ai-sim-harness/fixed-step-clock-check.js
