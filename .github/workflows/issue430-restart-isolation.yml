name: ⭐ Restart Isolation Regression

on:
  push:
    branches: [fix/issue430-samepage-restart-isolation]
  pull_request:
    paths:
      - 'battle/modules/14-wound-model.js'
      - 'scripts/run_issue430_samepage_repro.cjs'
      - 'tools/ai-sim-harness/wound-restart-isolation-check.js'
      - '.github/workflows/issue430-restart-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-regression:
    name: Wound restart owner regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/ai-sim-harness/wound-restart-isolation-check.js

  same-page:
    name: ${{ matrix.scenario }} · consecutive 600s same-page fingerprints
    needs: owner-regression
    strategy:
      fail-fast: false
      matrix:
        scenario: [meeting, us-defend, ge-defend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PARITY_SCENARIO: ${{ matrix.scenario }}
      PARITY_SEED: timescale-parity
      PARITY_SECONDS: '600'
      PARITY_CASES: none
      PARITY_OUT: reports/restart430/${{ matrix.scenario }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and restart static contract
        run: |
          node --check scripts/run_issue430_samepage_repro.cjs
          node tools/ai-sim-harness/benchmark-restart-isolation-check.js
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local battle server
        run: |
          set -euo pipefail
          mkdir -p /tmp/battle-www
          ln -s "$GITHUB_WORKSPACE" /tmp/battle-www/grasstex
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8765 -t /tmp/battle-www >/tmp/battle-php.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=healthcheck' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/battle-php.log
          exit 1
      - name: Compare two consecutive reference battles in one page
        run: node scripts/run_issue430_samepage_repro.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restart-isolation-${{ matrix.scenario }}-${{ github.run_number }}
          path: reports/restart430/
          if-no-files-found: warn
          retention-days: 14

  fresh-parity:
    name: ${{ matrix.scenario }} · fresh-page 1x/4x/8x parity
    needs: owner-regression
    strategy:
      fail-fast: false
      matrix:
        scenario: [meeting, us-defend, ge-defend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PARITY_SCENARIO: ${{ matrix.scenario }}
      PARITY_SEED: timescale-parity
      PARITY_SECONDS: '600'
      PARITY_CASES: 1x@20,4x@60,8x@120
      PARITY_OUT: reports/timescale-parity/${{ matrix.scenario }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixed-step contract
        run: |
          node --check scripts/run_timescale_parity_benchmark.cjs
          node tools/ai-sim-harness/fixed-step-clock-check.js
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local battle server
        run: |
          set -euo pipefail
          mkdir -p /tmp/battle-www
          ln -s "$GITHUB_WORKSPACE" /tmp/battle-www/grasstex
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8765 -t /tmp/battle-www >/tmp/battle-php.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=healthcheck' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/battle-php.log
          exit 1
      - name: Replay fresh pages across representative 1x/4x/8x clocks
        run: node scripts/run_timescale_parity_benchmark.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-timescale-parity-${{ matrix.scenario }}-${{ github.run_number }}
          path: reports/timescale-parity/
          if-no-files-found: warn
          retention-days: 14
