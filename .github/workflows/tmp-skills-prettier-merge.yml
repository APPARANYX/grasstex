name: Temporary Skills Lab merge-format
on:
  pull_request:
    paths:
      - .github/workflows/tmp-skills-prettier-merge.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: |
          npx --yes prettier@3.3.3 --write battle/skills-lab.js scripts/probes/probe_skills_lab.cjs
          node - <<'NODE'
          const fs=require('fs');
          for(const path of ['battle/skills-lab.js','scripts/probes/probe_skills_lab.cjs'])
            console.log('FORMAT_HANDOFF '+JSON.stringify({path,content:fs.readFileSync(path,'utf8')}));
          NODE
