name: Temporary contact graph formatting
on:
  pull_request:
    paths:
      - .github/workflows/tmp-contact-graph-format.yml
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: |
          npx --yes prettier@3.3.3 --write battle/modules/13e-tactical-covered-maneuver.js battle/modules/13g-tactical-contact-route.js battle/skills-lab.js tools/ai-sim-harness/tactical-contact-route-check.js scripts/probes/probe_skills_lab_drills.cjs
          node - <<'NODE'
          const fs=require('fs');
          for(const path of ['battle/modules/13e-tactical-covered-maneuver.js','battle/modules/13g-tactical-contact-route.js','battle/skills-lab.js','tools/ai-sim-harness/tactical-contact-route-check.js','scripts/probes/probe_skills_lab_drills.cjs'])
            console.log('FORMAT_HANDOFF '+JSON.stringify({path,content:fs.readFileSync(path,'utf8')}));
          NODE
