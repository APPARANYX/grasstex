name: Experimental mobile Mini Map full audio 683
on:
  pull_request:
    types: [synchronize]
    paths:
      - scripts/probes/probe_mobile_mini_meeting_audio.cjs
      - .github/workflows/mobile-mini-audio-683.yml

permissions:
  contents: read

concurrency:
  group: mobile-mini-audio-683
  cancel-in-progress: true

jobs:
  mobile-mini:
    if: github.event.pull_request.number == 683
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Stage actual pull request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl -fSL --retry 2 --max-time 120 \
            'https://test.ivandpopov.com/grasstex/preview.php?ref=683' \
            -o /tmp/staged-preview-mobile.html
          curl -fSL --retry 2 --max-time 45 \
            "https://test.ivandpopov.com/grasstex/preview/ref-${HEAD_SHA:0:12}/battle_sim.php" \
            -o /tmp/staged-mini-mobile.html
          echo "Staged exact head ref-${HEAD_SHA:0:12}"
      - name: Exact-source Skills Lab preflight before native battle audio
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export SKILLS_LAB_URL="https://test.ivandpopov.com/grasstex/preview/ref-${HEAD_SHA:0:12}/battle_sim.php"
          node scripts/probes/probe_skills_lab.cjs
      - name: Run full Mini Map on desktop and emulated mobile devices
        id: benchmark
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MOBILE_MINI_SECONDS: '20'
          MOBILE_MINI_WARMUP_SECONDS: '150'
          MOBILE_MINI_PROFILE: 'desktop-192'
        run: |
          export MOBILE_MINI_URL="https://test.ivandpopov.com/grasstex/preview/ref-${HEAD_SHA:0:12}/battle_sim.php"
          set -euo pipefail
          for backend in babylon howler; do
            export MOBILE_MINI_BACKEND="$backend"
            export MOBILE_MINI_OUT="reports/mobile-mini-audio/$backend"
            node scripts/probes/probe_mobile_mini_meeting_audio.cjs
          done
      - name: Upload results including device viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-mini-audio-full-limits
          path: reports/mobile-mini-audio/
          if-no-files-found: warn
      - name: Confirm mobile probe completed
        if: steps.benchmark.outcome != 'success'
        run: |
          echo "::error::Mobile full-limits probe failed; inspect saved mobile-mini-audio-full-limits."
          exit 1
