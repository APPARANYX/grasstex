name: TEMP Verify Playable Interception Preview (self-removing)
on:
  push:
    branches:
      - work/strategic-interception-macro-20261016
    paths:
      - .github/workflows/temp-interception-preview-verify.yml
permissions:
  contents: write
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Remove temporary workflow and capture immutable source
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-interception-preview-verify.yml
          git config user.name "grasstex-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(preview): remove one-shot playable-preview verifier"
          git push origin HEAD:work/strategic-interception-macro-20261016
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Stage and verify exact hosted code via existing preview launcher
        shell: bash
        env:
          HOST: https://test.ivandpopov.com/grasstex
        run: |
          set -euo pipefail
          slug="ref-${SOURCE_SHA:0:12}"
          launcher="$HOST/preview.php?ref=work%2Fstrategic-interception-macro-20261016"
          curl --fail --silent --show-error --location --max-time 240 "$launcher" -o "$RUNNER_TEMP/interception-preview-page.html"
          preview="$HOST/preview/$slug"
          curl --fail --silent --show-error --max-time 50 "$preview/preview.json" -o "$RUNNER_TEMP/interception-preview.json"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/interception-preview.json'))
          assert d['sha']==os.environ['SOURCE_SHA'],(d['sha'],os.environ['SOURCE_SHA'])
          print('Verified live preview exact SHA',d['sha'],'assets',d.get('assetsStaged'),d.get('assets'))
          PY
          curl --fail --silent --show-error --max-time 60 "$preview/battle/camera-controls.js" -o "$RUNNER_TEMP/preview-camera.js"
          grep -Fq 'FIELD_W >= 5000 ? 420 : 175' "$RUNNER_TEMP/preview-camera.js"
          curl --fail --silent --show-error --max-time 60 "$preview/battle_sim.php?strategicInterception=1&motorTransport=1&aerialRecon=1&interception=1" -o "$RUNNER_TEMP/interception-play.html"
          grep -q "preview-${SOURCE_SHA:0:7}" "$RUNNER_TEMP/interception-play.html"
          echo "PREVIEW_URL=$preview/battle_sim.php?strategicInterception=1&motorTransport=1&aerialRecon=1&interception=1" >> "$GITHUB_ENV"
          echo "Verified live playable 5km preview and flight speed."
      - name: Publish verified URL on active draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "### Playable branch preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Immutable source: `$SOURCE_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Play strategic interceptions with faster fly camera]($PREVIEW_URL)" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment 559 --body "### Live playable strategic preview verified

          Branch-only host preview is serving commit \`$SOURCE_SHA\` and the updated keyboard Shift / gamepad RB fast-flight camera (420 on 5 km).

          [Play with interception flags enabled]($PREVIEW_URL)

          The preview is isolated from production. Native tactical/ambush acceptance remains separate; keep #559 and #545 unmerged."
