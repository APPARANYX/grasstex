name: Audit 456 module-profile formatter
on:
  push:
    branches:
      - 'work/format-audit456/profiles'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/audit456-prod-module-profiles
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format module-profile harness only
        run: |
          set -euo pipefail
          npx --yes prettier@3.3.3 --write tools/ai-sim-harness/module-load-profile-check.js
          git add tools/ai-sim-harness/module-load-profile-check.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format PHP profile validation'
          git push origin HEAD:work/audit456-prod-module-profiles
