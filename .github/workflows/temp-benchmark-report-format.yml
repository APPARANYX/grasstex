name: Temporary benchmark report formatter
on:
  push:
    branches:
      - work/audit-benchmark-report-correctness
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes prettier@3.3.3 --write tools/ai-sim-harness/benchmark-compare-check.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "grasstex-format-bot"
          git config user.email "grasstex-format-bot@users.noreply.github.com"
          git add tools/ai-sim-harness/benchmark-compare-check.js
          git commit -m "Format benchmark report regressions"
          git push
