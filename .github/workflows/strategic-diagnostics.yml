name: ⭐ Strategic Diagnostic Replay

# Browser benchmark evidence, not a synthetic harness. Does not alter AI decisions.
on:
  pull_request:
    paths:
      - 'battle/squad-ai.js'
      - 'battle/commander-routes.js'
      - 'battle/modules/15f-squad-leader-retreat-anchor.js'
      - 'battle/modules/21-defender-engineers.js'
      - 'battle/modules/43-squad-forward-progress.js'
      - 'scripts/triage_battle_diagnostics.cjs'
      - 'scripts/probes/strategic-mission-trace.js'
      - 'tools/ai-sim-harness/diagnostic-triage-check.cjs'
      - '.github/workflows/strategic-diagnostics.yml'
  workflow_dispatch:
    inputs:
      seed:
        description: Replay seed prefix
        required: false
        default: 'strategic-diag-001'
      battles_per_scenario:
        description: Number of complete 5 km battles per scenario
        required: false
        default: '10'
      seconds:
        description: Simulated seconds (minimum 60)
        required: false
        default: '1800'

permissions:
  contents: read

concurrency:
  group: strategic-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic-replay:
    name: ${{ matrix.type }} · forensic browser replay
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        type: [meeting, us-defend, ge-defend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only triage
        run: |
          node --check scripts/triage_battle_diagnostics.cjs
          node tools/ai-sim-harness/diagnostic-triage-check.cjs
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated 5 km simulation server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/strategic-diagnostics-site"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/strategic-diagnostics-site/grasstex"
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8765 \
            -t "$RUNNER_TEMP/strategic-diagnostics-site" >"$RUNNER_TEMP/strategic-diagnostics-php.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8765/grasstex/battle_sim_local.php?strategicInterception=1&seed=healthcheck' -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/strategic-diagnostics-php.log"
          exit 1
      - name: Replay the real strategic battle and collect diagnostic evidence
        env:
          TYPE: ${{ matrix.type }}
          SEED_PREFIX: ${{ github.event.inputs.seed || 'strategic-diag-001' }}
          BATTLE_BENCHMARK_COUNT: ${{ github.event.inputs.battles_per_scenario || '10' }}
          BATTLE_BENCHMARK_TIME_LIMIT: ${{ github.event.inputs.seconds || '1800' }}
          BATTLE_BENCHMARK_STEP: '0.15'
          BATTLE_BENCHMARK_OUTPUT: reports
          BATTLE_BENCHMARK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BATTLE_BENCHMARK_POLICY_URL: http://127.0.0.1:8765/grasstex/battle_policy.php
        run: |
          set -euo pipefail
          case "$TYPE" in
            meeting) extra='' ;;
            us-defend) extra='&defender=us' ;;
            ge-defend) extra='&defender=ge' ;;
            *) exit 2 ;;
          esac
          export BATTLE_BENCHMARK_URL="http://127.0.0.1:8765/grasstex/battle_sim_local.php?strategicInterception=1${extra}"
          export BATTLE_BENCHMARK_SEED="${SEED_PREFIX}-${TYPE}"
          node scripts/run_battle_benchmark.mjs
      - name: Enforce seed coverage and the actual 12-objective strategic profile
        run: |
          node <<'NODE'
          const fs = require('node:fs'), assert = require('node:assert/strict');
          const data = JSON.parse(fs.readFileSync('reports/battle-benchmark.json', 'utf8'));
          const expected = Number(process.env.REQUESTED || '10');
          assert.equal(data.battles.length, expected, 'requested strategic seed coverage is incomplete');
          for (const b of data.battles) {
            assert.equal(b.objectiveCount, 12, b.seed + ': not the 5km 12-objective profile');
            assert.equal(b.battleType, process.env.TYPE, b.seed + ': benchmark mode label');
            if (process.env.TYPE === 'meeting') {
              assert.equal(b.deployment?.mode, 'meeting', b.seed + ': expected meeting deployment');
            } else {
              assert.equal(b.deployment?.mode, 'prepared-defender', b.seed + ': expected prepared defense');
              assert.equal(b.deployment?.defender, process.env.TYPE.split('-')[0], b.seed + ': defending side mismatch');
            }
            assert.equal(b.diagnosticAnalysis?.integrity?.ok, true, b.seed + ': diagnostic integrity');
            assert.ok(b.timeline?.samples?.length > 0, b.seed + ': no timeline');
          }
          console.log('PASS', expected, 'actual strategic browser battles, complete diagnostics');
          NODE
        env:
          REQUESTED: ${{ github.event.inputs.battles_per_scenario || '10' }}
          TYPE: ${{ matrix.type }}
      - name: Triage the highest-risk seeds, orders and stalls
        if: success()
        run: |
          node scripts/triage_battle_diagnostics.cjs reports/battle-benchmark.json reports
          cat reports/diagnostic-triage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Automatically choose the worst complete diagnostic seed
        if: success()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const triage = JSON.parse(fs.readFileSync('reports/diagnostic-triage.json', 'utf8'));
          const worst = triage.top.find(b => b.evidenceValid && b.seed);
          if (!worst) throw new Error('No diagnostically valid seed available for forensic replay');
          fs.appendFileSync(process.env.GITHUB_ENV, 'FOCUS_SEED=' + worst.seed + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '\n### Targeted forensic replay\n\nSelected: \`' + worst.seed + '\` (' + worst.battleType +
            '), priority ' + worst.score + '. This is a triage ranking, not causal proof.\n');
          console.log('FOCUS_SEED ' + worst.seed, worst.counts);
          NODE
      - name: Per-squad forensic replay plus no-probe control
        if: success()
        env:
          TYPE: ${{ matrix.type }}
          PROBE: strategic-mission-trace,squad-idle
          PROBE_SECONDS: ${{ github.event.inputs.seconds || '1800' }}
          PROBE_STEP: '0.15'
          PROBE_CONTROL: '1'
          PROBE_OUTPUT: reports/worst-seed-forensic.json
        run: |
          set -euo pipefail
          export PROBE_URL="http://127.0.0.1:8765/grasstex/battle_sim_local.php?strategicInterception=1"
          export PROBE_BATTLES="${TYPE}:${FOCUS_SEED}"
          node scripts/run_probe.cjs > /dev/null
          node <<'NODE'
          const fs = require('node:fs'), assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync('reports/worst-seed-forensic.json', 'utf8'));
          assert.equal(report.battles.length, 1);
          const b = report.battles[0];
          assert.equal(b.sameBattle, true, 'forensic probe changed the simulated outcome/state');
          const trace = b.reports['strategic-mission-trace'];
          assert.equal(trace?.schema, 'grasstex-strategic-forensic-v1');
          assert.ok(trace.squadSamples.length > 50);
          const defects = trace.invariantViolations || [];
          fs.writeFileSync('reports/forensic-findings.md', [
            '# Targeted strategic forensic replay',
            '',
            '- Seed: \`' + b.seed + '\`',
            '- Scenario: ' + b.type,
            '- Simulated: ' + b.simSeconds + ' seconds',
            '- Fingerprint matched uninstrumented control: **' + b.sameBattle + '**',
            '- Squad snapshots: ' + trace.squadSamples.length,
            '- Potential strategic invariant violations: **' + defects.length + '**',
            '',
            '## Findings',
            '',
            defects.length ? defects.map(d => '- ' + d.code + ' at ' + d.firstSeen + 's for ' + d.squad).join('\n') : 'No monitored strategic invariant violations observed.',
            '',
            'See worst-seed-forensic.json for exact per-squad spatial and mission evidence.'
          ].join('\n') + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '\n- Probe/control fingerprints identical: **yes**\n- Strategic invariant alerts: **' + defects.length + '**\n');
          NODE
      - name: Archive all forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategic-diagnostics-${{ matrix.type }}-${{ github.run_number }}
          path: |
            reports/
            ${{ runner.temp }}/strategic-diagnostics-php.log
          if-no-files-found: warn
          retention-days: 21

  acceptance-report:
    name: Aggregate strategic diagnostic acceptance
    needs: diagnostic-replay
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download evidence from all deployment modes
        uses: actions/download-artifact@v4
        with:
          pattern: strategic-diagnostics-*-${{ github.run_number }}
          path: shard-reports
      - name: Merge all 30 evidence streams
        env:
          EXPECTED_PER_MODE: ${{ github.event.inputs.battles_per_scenario || '10' }}
        run: |
          set -euo pipefail
          BATTLE_BENCHMARK_MERGE_INPUT=shard-reports \
            BATTLE_BENCHMARK_OUTPUT=reports/all \
            node scripts/merge_battle_benchmarks.mjs
          node scripts/triage_battle_diagnostics.cjs reports/all/battle-benchmark.json reports/all
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const report = JSON.parse(fs.readFileSync('reports/all/battle-benchmark.json', 'utf8'));
          const diagnostic = report.summary?.diagnosticAudit || {};
          const expected = Number(process.env.EXPECTED_PER_MODE || 10);
          const types = ['meeting', 'us-defend', 'ge-defend'];
          const problems = [];
          if (report.battles.length !== expected * types.length)
            problems.push('Incomplete sample: ' + report.battles.length + '/' + expected * types.length);
          if (!diagnostic.ok) problems.push('Diagnostic evidence audit failed');
          for (const type of types) {
            const count = report.battles.filter(b => b.battleType === type).length;
            if (count !== expected) problems.push(type + ' has only ' + count + '/' + expected + ' seeds');
          }
          const forensic = [];
          for (const type of types) {
            const shard = path.join('shard-reports',
              'strategic-diagnostics-' + type + '-' + process.env.GITHUB_RUN_NUMBER);
            /* upload-artifact receives both reports/ and $RUNNER_TEMP/log.
               Its common-parent directory nests reports under
               grasstex/grasstex/reports/, not the artifact root. */
            const paths = [
              path.join(shard, 'grasstex', 'grasstex', 'reports', 'worst-seed-forensic.json'),
              path.join(shard, 'reports', 'worst-seed-forensic.json'),
              path.join(shard, 'worst-seed-forensic.json')
            ];
            const file = paths.find(p => fs.existsSync(p));
            if (!file) {
              problems.push(type + ' is missing controlled forensic replay at ' + paths.join(' or '));
              continue;
            }
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const r = data.battles?.[0], trace = r?.reports?.['strategic-mission-trace'];
            if (!r || r.sameBattle !== true || !trace)
              problems.push(type + ' probe/control divergence or missing trace');
            const alerts = trace?.invariantViolations || [];
            if (alerts.length) problems.push(type + ' has ' + alerts.length + ' strategic invariant alert(s)');
            forensic.push({ type, seed: r?.seed || null, parity: r?.sameBattle === true,
              sampleCount: trace?.squadSamples?.length || 0, alerts });
          }
          const incident = report.summary?.issueCounts || {};
          const verdict = problems.length ? 'REVIEW REQUIRED' : 'BASELINE VERIFIED';
          const out = {
            schema: 'grasstex-strategic-evidence-gate-v1',
            verdict, complete: !problems.length, problems,
            expectedBattles: expected * types.length,
            actualBattles: report.battles.length,
            diagnosticIntegrity: !!diagnostic.ok, issueCounts: incident,
            scenarioCoverage: types.map(type => ({
              type, count: report.battles.filter(b => b.battleType === type).length
            })),
            forensic,
            caveat: 'Passing validates diagnostic coverage and inspected invariants, not all AI behavior. Known 5km road-aligned low-progress warnings require route-aware diagnosis before vehicle acceptance.'
          };
          fs.writeFileSync('reports/all/strategic-evidence-gate.json',
            JSON.stringify(out, null, 2) + '\n');
          const md = [
            '# Strategic Interception Phase 1 — automated evidence gate',
            '',
            '## ' + verdict,
            '',
            '- Completed: **' + out.actualBattles + '/' + out.expectedBattles + '**',
            '- Diagnostic integrity: **' + (out.diagnosticIntegrity ? 'PASS' : 'FAIL') + '**',
            '- Forensic controls: **' + forensic.filter(f => f.parity).length +
              '/3 identical replay fingerprints**',
            '- Writer conflicts: ' + (incident.writerConflicts || 0) +
              ', route stalls: ' + (incident.routeStalls || 0) +
              ', movement stalls: ' + (incident.movementStalls || 0) +
              ', loop alerts: ' + (incident.loopAlerts || 0),
            '',
            '### Outstanding blockers',
            '',
            ...(problems.length ? problems.map(x => '- ' + x) :
              ['- No missing data or sampled strategic invariant violations. Road-progress false positives remain a separate investigation.']),
            '',
            'A good score is not evidence of a good tactical decision. Inspect the ranked seed traces.',
            ''
          ].join('\n');
          fs.writeFileSync('reports/all/strategic-evidence-gate.md', md);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          console.log('STRATEGIC_EVIDENCE_GATE', verdict, 'seed count', out.actualBattles);
          if (problems.length) process.exitCode = 1;
          NODE
      - name: Publish consolidated acceptance and forensic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategic-acceptance-all-${{ github.run_number }}
          path: reports/all/
          retention-days: 21
          if-no-files-found: warn
