name: Experimental full battlefield audio mix 683
on:
  pull_request:
    types: [synchronize]
    paths:
      - battle/audio-lab.js
      - battle/audio_lab.html
      - battle/full-audio-stress.js
      - battle/modules/00a-audio-mix.js
      - battle/modules/11-voice-variation.js
      - battle/modules/12a-listener-acoustics.js
      - battle/modules/15-combat-audio.js
      - battle/modules/15-weapon-foley-audio.js
      - battle/modules/24a-grenade-audio.js
      - scripts/probes/probe_audio_lab.cjs
      - .github/workflows/full-mix-audio-683.yml

permissions:
  contents: read

concurrency:
  group: full-mix-audio-683
  cancel-in-progress: true

jobs:
  full-mix:
    if: github.event.pull_request.number == 683
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture Prettier's exact full-mix source formatting for audit
        run: |
          npx --yes prettier@3.3.3 --write battle/full-audio-stress.js battle/modules/00a-audio-mix.js battle/modules/00-audio-format.js tools/ai-sim-harness/audio-format-check.js
          for file in battle/full-audio-stress.js battle/modules/00a-audio-mix.js battle/modules/00-audio-format.js tools/ai-sim-harness/audio-format-check.js; do
            echo "FORMATTED_SOURCE_START:$file"
            base64 -w0 "$file"
            echo
            echo "FORMATTED_SOURCE_END:$file"
          done
      - name: Install real Chromium playback runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Stage exact draft PR head
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl -fSL --retry 2 --max-time 120 \
            'https://test.ivandpopov.com/grasstex/preview.php?ref=683' \
            -o /tmp/staged-full-mix.html
          curl -fSL --retry 2 --max-time 40 \
            "https://test.ivandpopov.com/grasstex/preview/ref-${HEAD_SHA:0:12}/battle/full-audio-stress.js" \
            -o /tmp/staged-full-mix-owner.js
          test -s /tmp/staged-full-mix-owner.js
      - name: Stress all infantry audio owners through shipping mix and acoustics
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUDIO_LAB_TIMEOUT_MS: '200000'
          AUDIO_LAB_REPORT: reports/full-mix-audio-683/report.json
        run: |
          export AUDIO_LAB_URL="https://test.ivandpopov.com/grasstex/preview/ref-${HEAD_SHA:0:12}/battle/audio_lab.html?fullMix=1&tacticalController=new&duration=145&speed=4&squads=5&occlusion=mixed"
          node scripts/probes/probe_audio_lab.cjs
      - name: Upload actual output/owner diagnostic history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-mix-audio-683
          path: reports/full-mix-audio-683/
          if-no-files-found: warn
