name: Temporary timeline formatter
on:
  push:
    branches:
      - work/diag-loop-event-time
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes prettier@3.3.3 --write battle/modules/97-ai-timeline-recorder.js tools/ai-sim-harness/observer-diagnostic-trigger-check.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "grasstex-format-bot"
          git config user.email "grasstex-format-bot@users.noreply.github.com"
          git add battle/modules/97-ai-timeline-recorder.js tools/ai-sim-harness/observer-diagnostic-trigger-check.js
          git commit -m "Format timeline event-time fix"
          git push
