name: Temporary hedgerow edge plus safety expanded verification
on:
  push:
    branches:
      - work/hedge418-expanded-repro
permissions:
  contents: read
jobs:
  hedge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tools/ai-sim-harness/hedgerow-firing-lane-check.js
          node tools/ai-sim-harness/cover-positions-check.js
