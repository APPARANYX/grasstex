name: Temporary Skills Lab formatting handoff
on:
  pull_request:
    paths:
      - .github/workflows/skills-lab-format-handoff.yml
permissions:
  contents: read
jobs:
  exact-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npx --yes prettier@3.3.3 --write battle/skills-lab.js battle/scenario-generator.js scripts/probes/probe_skills_lab.cjs
          node - <<'NODE'
          const fs=require('fs');
          for(const path of ['battle/skills-lab.js','battle/scenario-generator.js','scripts/probes/probe_skills_lab.cjs'])
            console.log('FORMAT_HANDOFF '+JSON.stringify({path,content:fs.readFileSync(path,'utf8')}));
          NODE
