name: PR521 temporary Prettier export
on:
  pull_request:
    paths:
      - .github/workflows/phase-c-format-export.yml
      - battle/modules/15j-squad-leader-fire-and-movement.js
      - tools/ai-sim-harness/covered-pressure-bound-check.js
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prettier 3.3.3 print canonical files
        run: |
          npx --yes prettier@3.3.3 --write battle/modules/15j-squad-leader-fire-and-movement.js tools/ai-sim-harness/covered-pressure-bound-check.js
          echo 'START_SOURCE_15J'
          base64 -w0 battle/modules/15j-squad-leader-fire-and-movement.js
          echo
          echo 'END_SOURCE_15J'
          echo 'START_TEST_C'
          base64 -w0 tools/ai-sim-harness/covered-pressure-bound-check.js
          echo
          echo 'END_TEST_C'
